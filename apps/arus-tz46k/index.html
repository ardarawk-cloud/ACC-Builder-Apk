<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Penghitung Uang Harian</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f5f5;color:#333;line-height:1.5}
.container{max-width:480px;margin:0 auto;padding:10px}
header{background:#2c3e50;color:#fff;padding:12px;text-align:center;border-radius:8px}
h1{font-size:1.4rem;margin:0}
main{background:#fff;padding:10px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
section{margin-bottom:15px}
h2{font-size:1.1rem;margin-bottom:8px;color:#2c3e50}
input,select,textarea{width:100%;padding:10px;margin-top:5px;margin-bottom:10px;border:1px solid #ccc;border-radius:5px;font-size:1rem}
button{width:100%;padding:12px;background:#27ae60;color:#fff;border:none;border-radius:6px;font-size:1rem;cursor:pointer}
button:active{background:#219150}
ul{list-style:none}
li{padding:10px;margin-bottom:8px;background:#fafafa;border-radius:5px}
.amount{font-weight:bold}
.summary{display:flex;justify-content:space-between;font-size:1.1rem;background:#e8f5e9;padding:8px;border-radius:5px}
.total{font-weight:bold}
.transaction-list{background:#fafafa;border-radius:5px}
.transaction-list li{display:flex;justify-content:space-between;align-items:center}
.amount{color:#27ae60}
.expense{color:#e74c3c}
</style>
</head>
<body>
<div class="container">
<header><h1>Penghitung Uang Harian</h1></header>
<main>
<section>
<h2>Tambah Transaksi</h2>
<label for="type">Jenis</label>
<select id="type">
<option value="pemasukan">Pemasukan</option>
<option value="pengeluaran">Pengeluaran</option>
</select>
<label for="category">Kategori</label>
<select id="category">
<option value="Makanan">Makanan</option>
<option value="Transportasi">Transportasi</option>
<option value="Hiburan">Hiburan</option>
<option value="Lain-lain">Lain-lain</option>
</select>
<label for="amount">Jumlah (Rp)</label>
<input type="number" id="amount" placeholder="Masukkan jumlah" min="1">
<label for="desc">Keterangan</label>
<input type="text" id="desc" placeholder="Contoh: Belanja sayur">
</section>

<button id="addBtn">Tambah Transaksi</button>

<section class="summary">
<div>Total Pemasukan: <span id="totalIncome">0</span></div>
<div>Total Pengeluaran: <span id="totalExpense">0</span></div>
<div>Saldo Harian: <span id="balance">0</span></div>
</section>

<ul id="transactionList"></ul>
</main>
</div>

<script>
const STORAGE_KEY = 'dailyMoneyAppTransactions';
function loadTransactions(){
  const json = localStorage.getItem(STORAGE_KEY);
  return json ? JSON.parse(json) : [];
}
function saveTransactions(t){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(t));
}
function renderTransactions(){
  const list = document.getElementById('transactionList');
  list.innerHTML = '';
  const trans = loadTransactions();
  const today = new Date().toISOString().split('T')[0];
  trans
    .filter(t=>t.date===today)
    .forEach(t=>{
      const li = document.createElement('li');
      li.textContent = `${t.amount} - ${t.desc} (${t.type})`;
      li.className = 'amount';
      if(t.type==='pengeluaran'){
        li.classList.add('expense');
      }
      const del = document.createElement('button');
      del.textContent = 'Hapus';
      del.style.background='transparent';
      del.style.color='#e74c3c';
      del.style.border='none';
      del.style.cursor='pointer';
      del.style.fontSize='0.9rem';
      del.onclick = ()=>removeTransaction(t.id);
      li.appendChild(del);
      list.appendChild(li);
    });
}
function removeTransaction(id){
  const trans = loadTransactions();
  const filtered = trans.filter(t=>t.id!==id);
  saveTransactions(filtered);
  renderTransactions();
  calculateSummary();
}
function addTransaction(){
  const type = document.getElementById('type').value;
  const category = document.getElementById('category').value;
  const amount = parseFloat(document.getElementById('amount').value);
  const desc = document.getElementById('desc').value.trim();
  if(isNaN(amount)||!desc){
    alert('Silakan isi jumlah dan keterangan');
    return;
  }
  const trans = {
    id: Date.now(),
    type,
    category,
    amount,
    desc,
    date: new Date().toISOString().split('T')[0]
  };
  const transList = loadTransactions();
  transList.push(trans);
  saveTransactions(transList);
  document.getElementById('amount').value='';
  document.getElementById('desc').value='';
  renderTransactions();
  calculateSummary();
}
function calculateSummary(){
  const trans = loadTransactions();
  const today = new Date().toISOString().split('T')[0];
  const todayTrans = trans.filter(t=>t.date===today);
  const income = todayTrans
    .filter(t=>t.type==='pemasukan')
    .reduce((s,t)=>s+t.amount,0);
  const expense = todayTrans
    .filter(t=>t.type==='pengeluaran')
    .reduce((s,t)=>s+t.amount,0);
  const balance = income - expense;
  document.getElementById('totalIncome').textContent = `Rp ${income.toLocaleString()}`;
  document.getElementById('totalExpense').textContent = `Rp ${expense.toLocaleString()}`;
  document.getElementById('balance').textContent = `Rp ${balance.toLocaleString()}`;
}
document.getElementById('addBtn').addEventListener('click',addTransaction);
window.addEventListener('load',()=>{
  renderTransactions();
  calculateSummary();
});
</script>
</body>
</html>
