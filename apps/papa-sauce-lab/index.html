<script>
// ===================== CONFIG & CONSTANTS =====================
const DB_NAME='papa_sauce_lab_v2';
const DB_VER=2;
const PRODUCTS=['Ayam Woku','Cumi','Tongkol','Babi Rica','Babi Kecap','Sup Brenebone','Sup Grangasem'];
const EXP_CAT=['bahan baku','packaging','operasional','transport','kebersihan','peralatan','lainnya'];
const CHANNELS=['cash','qris','gojek','grab'];
const CH_LABEL={cash:'Cash',qris:'QRIS',gojek:'Gojek',grab:'Grab'};
let DB=null, currentTab='dashboard', currentRole='OWNER', currentUser='Admin', cloudState='off';
let histFilter='all', txnFilter='all', reportMode='daily';

// ===================== UTILITY =====================
function fmtRp(n){const v=Number(n)||0;return 'Rp'+v.toLocaleString('id-ID',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtDate(d){if(!d)return'—';const dt=new Date(d+'T00:00:00+08:00');return dt.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function fmtTime(d){if(!d)return'—';return new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false});}
function fmtDateTime(d){if(!d)return'—';const dt=new Date(d);return dt.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' '+dt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false});}
function todayStr(){return new Date().toLocaleDateString('id-ID',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Makassar'}).replace(/\//g,'-');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6);}
function nowISO(){return new Date().toISOString();}
function addDays(d,days){const dt=new Date(d+'T00:00:00+08:00');dt.setDate(dt.getDate()+days);return dt.toISOString().slice(0,10);}
function calcSales(channels){let c=0,q=0,g=0,gr=0;for(const s of channels){if(s.status==='CORRECTED')continue;const a=s.amount||0;if(s.channel==='cash')c+=a;else if(s.channel==='qris')q+=a;else if(s.channel==='gojek')g+=a;else if(s.channel==='grab')gr+=a;}return{cash:c,qris:q,gojek:g,grab:gr,total:c+q+g+gr};}
function calcExpenses(exps){let t=0;for(const e of exps){if(e.status==='CORRECTED')continue;t+=e.nominal||0;}return t;}
function calcStock(product,stockMv){let opening=0,inQ=0,outQ=0;for(const sm of stockMv){if(sm.product!==product)continue;if(sm.type==='STOCK_IN'||sm.type==='RESTOCK')inQ+=(sm.qty||0);else if(sm.type==='STOCK_OUT')outQ+=(sm.qty||0);}return{opening,inQ,outQ,closing:opening+inQ-outQ};}
function getPeriodHB(period,stockMv){if(!period)return 0;const sd=period.startDate;const td=todayStr();if(sd===td)return period.hbOpen||0;let hb=period.hbOpen||0;const snaps=await dbGetAll('daily_snapshots');for(const s of snaps){if(s.periodId===period.id&&s.date<td&&s.date>=sd){hb=s.totalRegister;}}return hb;}

// ===================== INDEXEDDB =====================
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onerror=()=>rej(req.error);
    req.onsuccess=()=>res(req.result);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      const mk=(name,keys)=>{const s=db.createObjectStore(name,{keyPath:keys[0],autoIncrement:true});keys.slice(1).forEach(k=>s.createIndex(k,k,{unique:false}));return s;};
      mk('accounting_periods',['id']);
      mk('transactions',['id','period_id','date']);
      mk('expenses',['id','period_id','date']);
      mk('stock_movements',['id','period_id','product','date']);
      mk('products',['id']);
      mk('daily_snapshots',['id','period_id','date']);
      mk('snapshot_stock_lines',['id','snapshot_id']);
      mk('audit_events',['id','period_id']);
      mk('sync_queue',['id']);
      mk('settings',['key']);
      mk('cloud_meta',['key']);
      mk('daily_hb',['date']);
    };
  });
}
function tx(store,mode){return DB.transaction(store,mode).objectStore(store);}
function dbPut(store,val){return new Promise((res,rej)=>{const t=tx(store,'readwrite');const r=t.put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbGet(store,key){return new Promise((res,rej)=>{const t=tx(store,'readonly');const r=t.get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbGetAll(store){return new Promise((res,rej)=>{const t=tx(store,'readonly');const r=t.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbDelete(store,key){return new Promise((res,rej)=>{const t=tx(store,'readwrite');const r=t.delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function dbClear(store){return new Promise((res,rej)=>{const t=tx(store,'readwrite');const r=t.clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function dbCount(store){return new Promise((res,rej)=>{const t=tx(store,'readonly');const r=t.count();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}

async function ensureSettings(){
  let s=await dbGet('settings','app');
  if(!s){
    s={key:'app',role:'OWNER',user:'Admin',cloudUrl:'',cloudKey:'',cloudEmail:'',cloudPassword:'',lastSync:null,pendingChanges:0,createdAt:nowISO()};
    await dbPut('settings',s);
  }
  currentRole=s.role||'OWNER';currentUser=s.user||'Admin';

}
async function ensurePeriod(){
  let p=await getActivePeriod();

    p={id:'PER-'+uid(),startDate:todayStr(),endDate:null,hbOpen:0,currentHB:0,status:'active',createdAt:nowISO()};
    await dbPut('accounting_periods',p);
  }

}
async function getActivePeriod(){
  const all=await dbGetAll('accounting_periods');
  return all.find(p=>p.status==='active')||null;
}
async function ensureProducts(){
  for(const name of PRODUCTS){const ex=await dbGet('products',name);if(!ex)await dbPut('products',{id:name,name,createdAt:nowISO()});}
}
async function loadCloudState(){
  const meta=await dbGet('cloud_meta','state');
  cloudState=(meta&&meta.state==='connected')?'connected':'off';
  updateCloudUI();
}
function updateCloudUI(){
  const dot=document.getElementById('cloud-dot'),txt=document.getElementById('cloud-text');

}

async function drillDown(type){
  const period=await getActivePeriod();
  const sales=await dbGetAll('transactions');
  const expenses=await dbGetAll('expenses');
  const stockMv=await dbGetAll('stock_movements');
  let html='';
  if(type==='housebank'){
    html=`<h2>House Bank</h2><div class="row"><span class="r-label">Saldo HB (awal periode)</span><span class="r-value">${fmtRp(period?period.hbOpen:0)}</span></div><p style="font-size:12px;color:var(--gray);margin-top:8px">House Bank berasal dari closing hari sebelumnya. Tidak bisa diubah manual.</p>`;
  }else if(['cash','qris','gojek','grab'].includes(type)){
    const label=CH_LABEL[type];
    const items=sales.filter(s=>s.channel===type&&s.status==='ACTIVE');
    html=`<h2>Detail ${label}</h2>`;
    if(!items.length)html+='<div class="empty-state"><p>Belum ada transaksi '+label+'</p></div>';
    else html+=items.map(s=>`<div class="txn-item"><div class="t-left"><div class="t-time">${fmtTime(s.createdAt)}</div><div class="t-desc">${s.note||'Penjualan'}</div><span class="t-channel">${label}</span></div><div class="t-amt pos">${fmtRp(s.amount)}</div></div>`).join('');
  }else if(type==='totalsales'){
    html='<h2>Total Sales (Cash + QRIS + Gojek + Grab)</h2>';
    for(const ch of CHANNELS){const items=sales.filter(s=>s.channel===ch&&s.status==='ACTIVE');const tot=items.reduce((a,b)=>a+b.amount,0);html+=`<div class="card-title">${CH_LABEL[ch]} = ${fmtRp(tot)}</div>`;html+=items.length?items.map(s=>`<div class="txn-item"><div class="t-left"><div class="t-time">${fmtTime(s.createdAt)}</div><div class="t-desc">${s.note||'Penjualan'}</div></div><div class="t-amt pos">${fmtRp(s.amount)}</div></div>`).join(''):'<div class="empty-state"><p>Belum ada</p></div>';}
  }else if(type==='totalout'){
    const items=expenses.filter(e=>e.status==='ACTIVE');
    html='<h2>Total Pengeluaran</h2>';
    if(!items.length)html+='<div class="empty-state"><p>Belum ada pengeluaran</p></div>';
    else html+=items.map(e=>`<div class="txn-item"><div class="t-left"><div class="t-time">${fmtTime(e.createdAt)}</div><div class="t-desc">${e.name}</div><span class="t-channel">${e.category}</span></div><div class="t-amt neg">${fmtRp(e.nominal)}</div></div>`).join('');
  }else if(type==='register'){
    const {cash,qris,gojek,grab,total:ts}=calcSales(sales);const to=calcExpenses(expenses);const hb=period?period.hbOpen:0;const tr=hb+ts-to;
    html=`<h2>Total Register</h2><div class="detail-grid"><div class="dg"><div class="dg-l">House Bank</div><div class="dg-v">${fmtRp(hb)}</div></div><div class="dg"><div class="dg-l">Total Sales</div><div class="dg-v">${fmtRp(ts)}</div></div><div class="dg"><div class="dg-l">Total Out</div><div class="dg-v">${fmtRp(to)}</div></div><div class="dg"><div class="dg-l">Register</div><div class="dg-v">${fmtRp(tr)}</div></div></div><p style="font-size:11px;color:var(--gray)">Formula: HB + Total Sales - Total Out. Otomatis, tidak bisa ditimpa.</p>`;
  }else if(type==='stock'){
    html='<h2>Detail Total Stok</h2>';
    for(const pn of PRODUCTS){const s=calcStock(pn,stockMv);html+=`<div class="stock-bar ${s.closing<5?'low':''}" style="margin-bottom:8px"><span class="sb-name">${pn}</span><span class="sb-qty">${s.closing}</span><div class="sb-track"><div class="sb-fill" style="width:${Math.min(100,s.closing*10)}%"></div></div></div>`;}
  }
  openModal(html);
}

async function renderTxnList(){
  const search=(document.getElementById('txn-search')?.value||'').toLowerCase();
  const allSales=await dbGetAll('transactions');
  const allExp=await dbGetAll('expenses');
  const allStock=await dbGetAll('stock_movements');
  let items=[];
  for(const s of allSales)items.push({...s,type:'sales',display:'Penjualan',amt:s.amount,channelLabel:CH_LABEL[s.channel]});
  for(const e of allExp)items.push({...e,type:'expense',display:'Pengeluaran',amt:-e.nominal,channelLabel:e.category});
  for(const s of allStock)items.push({...s,type:'stock',display:'STOCK '+s.type.replace('_',' '),amt:-(s.qty||0),channelLabel:s.product});
  items=items.filter(i=>i.status!=='CORRECTED'||search.length>0);
  if(search)items=items.filter(i=>(i.note||'').toLowerCase().includes(search)||(i.user||'').toLowerCase().includes(search)||(i.name||'').toLowerCase().includes(search)||(i.product||'').toLowerCase().includes(search));
  if(txnFilter!=='all')items=items.filter(i=>{if(txnFilter==='stock')return i.type==='stock';if(txnFilter==='sales')return i.type==='sales';if(txnFilter==='expense')return i.type==='expense';return true;});
  items.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const list=document.getElementById('txn-list');
  if(!items.length){list.innerHTML='<div class="empty-state"><div class="icon">📋</div><p>Belum ada transaksi</p></div>';return;}
  list.innerHTML=items.map(i=>`<div class="txn-item ${i.status==='CORRECTED'?'corrected':''}" onclick="showTxnDetail('${i.id}','${i.type}')">
    <div class="t-left"><div class="t-time">${fmtDateTime(i.createdAt)}</div><div class="t-desc">${i.display}</div><span class="t-channel">${i.channelLabel||''}</span></div>
    <div class="t-amt ${i.amt<0?'neg':'pos'}">${i.amt<0?'-':''}${fmtRp(Math.abs(i.amt))}</div>
  </div>`).join('');
}

// ===================== CORRECTION =====================
async function openCorrection(id,type){
  let oldItem;
  if(type==='sales')oldItem=await dbGet('transactions',id);
  else if(type==='expense')oldItem=await dbGet('expenses',id);
  else oldItem=await dbGet('stock_movements',id);
  if(!oldItem)return;
  const oldVal=oldItem.amount!==undefined?fmtRp(oldItem.amount):oldItem.nominal!==undefined?fmtRp(oldItem.nominal):oldItem.qty+' unit';
  openModal(`<h2>Koreksi Transaksi</h2>
    <p style="font-size:12px;color:var(--gray);margin-bottom:10px">Nilai lama dipertahankan sebagai CORRECTED. Buat nilai baru.</p>
    <div class="row"><span class="r-label">ID</span><span class="r-value" style="font-size:11px">${oldItem.id}</span></div>
    <div class="row"><span class="r-label">Nilai Lama</span><span class="r-value">${oldVal}</span></div>
    <div class="form-group"><label>Nilai Baru (Rp)</label><input type="number" id="corr-new" placeholder="0" min="0"></div>
    <div class="form-group"><label>Alasan Koreksi</label><input type="text" id="corr-reason" placeholder="Jelaskan koreksi"></div>
    <button class="btn-primary" onclick="confirmCorrection('${id}','${type}')">Simpan Koreksi</button>
    <button class="btn-secondary" onclick="closeModal()" style="margin-top:6px">Batal</button>`);
}
async function confirmCorrection(id,type){
  const newVal=parseInt(document.getElementById('corr-new').value)||0;
  const reason=document.getElementById('corr-reason').value;
  if(!newVal){toast('Nilai baru wajib','error');return;}
  let oldItem;
  if(type==='sales')oldItem=await dbGet('transactions',id);
  else if(type==='expense')oldItem=await dbGet('expenses',id);
  else oldItem=await dbGet('stock_movements',id);
  if(!oldItem)return;
  const storeName=type==='sales'?'transactions':type==='expense'?'expenses':'stock_movements';
  oldItem.status='CORRECTED';oldItem.correctionOf=oldItem.id+'-orig';oldItem.correctedAt=nowISO();oldItem.correctedBy=currentUser;
  await dbPut(storeName,oldItem);
  const replacement={...oldItem,id:'TXN-'+uid(),status:'ACTIVE',correctionOf:oldItem.id,createdAt:nowISO()};
  if(type==='sales')replacement.amount=newVal;
  else if(type==='expense')replacement.nominal=newVal;
  else replacement.qty=newVal;
  await dbPut(storeName,replacement);
  await addAudit('correction',`Koreksi ${type} ${oldItem.id}: ${oldItem.amount||oldItem.nominal||oldItem.qty} → ${newVal}`,reason,currentRole);
  await addSyncQueue(storeName,'upsert',replacement);
  closeModal();toast('Koreksi tersimpan, entri lama dipertahankan sebagai CORRECTED');renderDashboard();
}

async function showProductDetail(name){

  openModal(html);
}

async function renderReport(){

  if(!date){toast('Pilih tanggal','error');return;}
  const period=await getActivePeriod();
  const sales=await dbGetAll('transactions');
  const expenses=await dbGetAll('expenses');
  const stockMv=await dbGetAll('stock_movements');
  const daySales=sales.filter(s=>s.date===date&&s.status!=='CORRECTED');
  const dayExp=expenses.filter(e=>e.date===date&&s.status!=='CORRECTED');
  const {cash,qris,gojek,grab,total:totalSales}=calcSales(sales.filter(s=>s.date===date));
  const totalOut=calcExpenses(expenses.filter(e=>e.date===date));
  // HB for this date
  let hb=period?period.hbOpen:0;
  const snaps=await dbGetAll('daily_snapshots');
  const prevSnap=snaps.filter(s=>s.periodId===period?.id&&s.date<date).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(prevSnap)hb=prevSnap.totalRegister;
  const totalRegister=hb+totalSales-totalOut;
  if(reportMode==='daily'){
    let html=`<div class="card"><div class="card-title">Laporan Harian — ${fmtDate(date)}</div>`;
    html+=`<div class="detail-grid"><div class="dg"><div class="dg-l">House Bank Awal</div><div class="dg-v">${fmtRp(hb)}</div></div><div class="dg"><div class="dg-l">Total Sales</div><div class="dg-v">${fmtRp(totalSales)}</div></div></div>`;

    html+=`<div class="card"><div class="card-title">Stok Per Produk (${fmtDate(date)})</div>`;

      const end=oi-oo;
      html+=`<div class="row"><span class="r-label">${pn}</span><span class="r-value">Awal:${oi} Restock:${ri} Keluar:${ro} Akhir:${end}</span></div>`;
    }
    html+=`</div>`;
    // Reconciliation
    const snap=snaps.find(s=>s.periodId===period?.id&&s.date===date);

    html+=`<div class="recon-row"><span>Expected Register</span><span>${fmtRp(totalRegister)}</span></div>`;

    for(const pn of PRODUCTS){let inQ=0,outQ=0;for(const sm of stockMv){if(sm.product!==pn||sm.date<weekStart||sm.date>weekEnd)continue;if(sm.type==='STOCK_IN'||sm.type==='RESTOCK')inQ+=(sm.qty||0);else if(sm.type==='STOCK_OUT')outQ+=(sm.qty||0);}html+=`<div class="row"><span class="r-label">${pn}</span><span class="r-value">Masuk:${inQ} Keluar:${outQ}</span></div>`;}
    html+=`</div>`;
    document.getElementById('report-content').innerHTML=html;
  }else if(reportMode==='monthly'){
    const [yy,mm]=date.split('-');const monthStart=`${yy}-${mm}-01`;const lastDay=new Date(parseInt(yy),parseInt(mm),0).getDate();const monthEnd=`${yy}-${mm}-${String(lastDay).padStart(2,'0')}`;

function exportReportCSV(date){
  (async()=>{
    const allS=await dbGetAll('transactions');const allE=await dbGetAll('expenses');const allSm=await dbGetAll('stock_movements');
    let csv='Tanggal,Kategori,Deskripsi,Channel/Kategori,Nominal\n';
    const dayS=allS.filter(s=>s.date===date&&s.status!=='CORRECTED');
    const dayE=allE.filter(e=>e.date===date&&e.status!=='CORRECTED');
    for(const s of dayS){csv+=`${s.date},Penjualan,${s.note||''},${CH_LABEL[s.channel]},${s.amount}\n`;}
    for(const e of dayE){csv+=`${e.date},Pengeluaran,${e.name},${e.category},${e.nominal}\n`;}
    for(const sm of allSm){if(sm.date===date)csv+=`${sm.date},Stok,${sm.type},${sm.product},${sm.qty}\n`;}
    const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='laporan-'+date+'.csv';a.click();URL.revokeObjectURL(url);toast('CSV didownload');
  })();
}
