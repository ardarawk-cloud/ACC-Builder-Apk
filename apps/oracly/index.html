<html lang="en">
<head>

<style>
:root{--bg:#07060d;--panel:#151120;--panel2:#1c152a;--line:#392d48;--gold:#d9ad56;--gold2:#f2d58e;--text:#f6efe3;--muted:#aea4bb;--safe:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#020205;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
body{display:flex;justify-content:center}
button,input,select{font:inherit}
button{touch-action:manipulation;cursor:pointer}

.app{width:100%;max-width:460px;min-height:100vh;position:relative;background:radial-gradient(circle at 82% 0,#2a1646 0,transparent 28%),radial-gradient(circle at 10% 22%,#171027 0,transparent 28%),linear-gradient(#090711,#05050a 55%,#07060d);overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(circle,#f5d98d 1px,transparent 1.3px),radial-gradient(circle,#9d7cff .8px,transparent 1px);background-size:67px 67px,103px 103px;background-position:11px 18px,31px 43px}
.screen{min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(92px + var(--safe));position:relative;z-index:1}
.no-nav{padding-bottom:30px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.title{font:500 26px Georgia,serif;margin:0;text-align:center}.back{width:44px;height:44px;border:0;background:transparent;color:var(--text);font-size:28px;border-radius:12px}.brand{font:500 42px Georgia,serif;letter-spacing:7px;text-align:center;color:var(--gold2)}.brand-sub{text-align:center;letter-spacing:2px;color:#d6c59f;font-size:11px}.moon{width:190px;height:190px;border:2px solid var(--gold);border-radius:50%;margin:54px auto 26px;display:grid;place-items:center;font-size:116px;color:var(--gold2);box-shadow:0 0 42px #9f6de022,inset 0 0 35px #d8b15e1f}.hero-copy{text-align:center;max-width:310px;margin:24px auto 30px}.hero-copy h2{font:500 25px Georgia,serif;margin:0 0 8px}.hero-copy p,.subtitle{color:var(--muted);font-size:13px;line-height:1.5}.btn{width:100%;min-height:48px;border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:15px}.goldbtn{background:linear-gradient(#f6db94,#cfa047);color:#171008}.ghostbtn{background:#171221;color:var(--text);border:1px solid var(--line)}.panel{background:linear-gradient(#171220,#100d17);border:1px solid var(--line);border-radius:18px;padding:16px}.goldline{border-color:#735a34}.home-head{display:flex;justify-content:space-between}.greet{font:500 26px/1.08 Georgia,serif}.greet small{display:block;font:12px Inter,system-ui;color:var(--muted);margin-top:9px}.crescent{font-size:50px;color:var(--gold2)}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.menu-item{border:0;background:transparent;color:#d8cedc;padding:0;min-width:0;font-size:10px;text-align:center}.menu-icon{height:56px;border:1px solid #342941;background:#171221;border-radius:14px;display:grid;place-items:center;font-size:22px;margin-bottom:6px}.section-title{font:500 19px Georgia,serif;margin:0 0 12px}.tarot-back{width:88px;height:134px;border:2px solid #b78f4b;border-radius:12px;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 10px,#47315d 11px 12px),linear-gradient(145deg,#17102d,#090713);display:grid;place-items:center;color:var(--gold2);font-size:28px;box-shadow:0 15px 35px #0009}.daily-card-button{display:block;width:100%;border:0;background:transparent;padding:10px 0 16px}.daily-card{height:160px;display:grid;place-items:center}.tap-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}.energy-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.energy{text-align:center;font-size:10px;color:#c8becd}.energy b{display:grid;place-items:center;margin:0 auto 6px;width:38px;height:38px;border-radius:50%;background:#191328;border:1px solid #392b4f;font-size:18px}.bottomnav{position:fixed;z-index:20;bottom:0;width:100%;max-width:460px;display:grid;grid-template-columns:repeat(4,1fr);background:#090810f2;border-top:1px solid #241d31;padding:8px 8px calc(8px + var(--safe))}.navitem{min-height:50px;border:0;background:transparent;color:#8d8499;font-size:10px;padding:4px;border-radius:12px}.navitem span{display:block;font-size:20px}.navitem.active{color:var(--gold2)}
.tabs{display:flex;background:#171320;border:1px solid #2e263c;border-radius:16px;padding:3px;margin-bottom:14px}.tab{flex:1;min-height:42px;border:0;background:transparent;color:#aaa1b3;padding:9px;border-radius:13px}.tab.active{background:linear-gradient(#f3d48c,#c99a45);color:#19100a;font-weight:800}.date{text-align:center;color:#aaa1b4;font-size:12px;margin:-4px 0 14px}.rating{text-align:center;font-size:24px;color:var(--gold2);letter-spacing:2px}.list{display:flex;flex-direction:column;gap:10px}.rowbtn,.rowstatic{width:100%;display:flex;align-items:center;gap:12px;border:1px solid #342b43;background:#15111e;color:var(--text);border-radius:14px;padding:12px;text-align:left;min-height:64px}.rowbtn:active,.menu-item:active,.pick:active,.zodiac:active{transform:scale(.985)}.rico{flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:#221830;display:grid;place-items:center;font-size:22px}.rmain{flex:1;min-width:0}.rtitle{font:500 16px Georgia,serif}.rdesc{font-size:11px;color:#aaa0b3;margin-top:3px;line-height:1.35}.chev{color:var(--gold2);font-size:20px}.lucky{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #30263f;border-radius:14px;overflow:hidden;margin-top:12px}.lucky div{padding:11px 6px;text-align:center;font-size:10px;background:#110e18}.lucky strong{display:block;color:var(--gold2);font-size:15px;margin-top:4px}
.three{display:flex;justify-content:center;gap:10px;margin:28px 0 18px}.pick{width:31%;max-width:118px;height:190px;border:0;background:transparent;padding:0;position:relative;border-radius:13px}.pick .tarot-back{width:100%;height:100%}.pick.selected{transform:translateY(-12px);filter:drop-shadow(0 0 14px #d8b15e55)}.pick.selected:after{content:'✓';position:absolute;right:-4px;top:-6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--gold2);color:#171008;font-weight:900}.pick-labels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;font-size:11px;color:var(--muted);margin-top:-8px;margin-bottom:18px}.reading-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.reading-cards.one{grid-template-columns:1fr;max-width:155px;margin:18px auto}.face{border:1px solid #80643b;border-radius:10px;overflow:hidden;background:#151022}.face-art{height:124px;background:linear-gradient(160deg,#3c274f,#12101d 55%,#5e4625);display:grid;place-items:center;font-size:38px;color:#f5dc97}.face-name{font-size:10px;font-weight:800;text-align:center;padding:7px 3px;background:#e6c36e;color:#17100a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pos{text-align:center;color:#a99fb1;font-size:10px;margin-top:5px}.reading-text{font:14px/1.55 Georgia,serif;color:#ded4e1}.gold{color:var(--gold2)}
.zodiac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin-top:22px}.zodiac{border:0;background:transparent;color:#d8cedc;font-size:12px;padding:4px;text-align:center}.zsym{width:60px;height:60px;margin:0 auto 7px;border-radius:50%;border:1px solid #8f7042;display:grid;place-items:center;color:var(--gold2);font-size:29px;background:#100d17}.zodiac-hero{display:flex;align-items:center;gap:13px;margin-bottom:12px}.zodiac-hero .zsym{margin:0}.zn{font:500 24px Georgia,serif}.bars{display:flex;flex-direction:column;gap:12px;margin:18px 0}.barline{display:grid;grid-template-columns:92px 1fr 38px;gap:8px;align-items:center;font-size:12px}.bar{height:7px;border-radius:9px;background:#292033;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a4ab8,#b66df0)}.compat-hero{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;text-align:center}.compat-x{font-size:28px;color:#c99f55}.score{text-align:center;font:40px Georgia,serif;color:var(--gold2);margin:16px 0}.score small{display:block;font:14px Inter,system-ui;color:#d8cfdc}.form{display:flex;flex-direction:column;gap:12px}.label{font-size:12px;color:#c7bccb}.input{width:100%;min-height:46px;margin-top:6px;border:1px solid #30283d;background:#14101d;color:#f7f2f7;border-radius:10px;padding:12px}.profile-card{display:flex;gap:14px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;border:1px solid #8e7040;background:#181020;display:grid;place-items:center;font-size:35px}.traitgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.trait{border:1px solid #31283f;border-radius:12px;background:#14101d;padding:11px;font-size:11px;color:#a89fb1}.trait strong{display:block;color:#eee4ed;font-size:14px;margin-top:4px}.premium-banner{width:100%;border:0;background:linear-gradient(90deg,#f0ca72,#d29c3e);color:#171008;border-radius:12px;padding:13px;display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:16px 0}.premium-list{list-style:none;padding:0}.premium-list li{padding:9px 0;border-bottom:1px solid #251c31}.premium-list li:before{content:'✓';color:var(--gold2);margin-right:10px}.notice{font-size:11px;color:#8f8699;text-align:center;line-height:1.5;margin-top:14px}.empty{padding:28px 16px;text-align:center;color:var(--muted)}.status-pill{display:inline-block;border:1px solid #5d4a33;border-radius:999px;padding:5px 9px;color:var(--gold2);font-size:10px}.spacer{height:12px}
</style>
</head>
<body>
<div id="app" class="app"><div class="stars"></div></div>
<script>
(function(){
'use strict';
var app=document.getElementById('app');
var mem={};
var state={page:'home',mode:'three',draw:[],zodiac:4,a:4,b:7,dailyPeriod:'today',horoPeriod:'today',historyFilter:'all'};
function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:d}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
function json(k,d){try{var raw=get(k,'');return raw?JSON.parse(raw):d}catch(e){return d}}
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
function seed(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function periodKey(period){if(period==='today')return todayKey();var d=new Date();if(period==='week'){var jan1=new Date(d.getFullYear(),0,1);var wk=Math.ceil((((d-jan1)/86400000)+jan1.getDay()+1)/7);return d.getFullYear()+'-W'+wk}return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function profile(){return json('oracly_profile',{name:'Arda',dob:'',time:'',gender:'Prefer not to say'})}
function histories(){return json('oracly_history',[])}
function addHistory(type,title,detail){var h=histories();h.unshift({id:Date.now(),type:type,title:title,detail:detail,date:new Date().toISOString()});set('oracly_history',JSON.stringify(h.slice(0,60)))}
var signs=[['Aries','♈','21 Mar – 19 Apr','Fire'],['Taurus','♉','20 Apr – 20 May','Earth'],['Gemini','♊','21 May – 20 Jun','Air'],['Cancer','♋','21 Jun – 22 Jul','Water'],['Leo','♌','23 Jul – 22 Aug','Fire'],['Virgo','♍','23 Aug – 22 Sep','Earth'],['Libra','♎','23 Sep – 22 Oct','Air'],['Scorpio','♏','23 Oct – 21 Nov','Water'],['Sagittarius','♐','22 Nov – 21 Dec','Fire'],['Capricorn','♑','22 Dec – 19 Jan','Earth'],['Aquarius','♒','20 Jan – 18 Feb','Air'],['Pisces','♓','19 Feb – 20 Mar','Water']];
var major=[['The Fool','New beginnings, openness and a leap of faith.','Pause before acting on impulse.','✦'],['The Magician','Use your skills and resources with intention.','Scattered focus can weaken your progress.','✧'],['The High Priestess','Trust intuition and observe what is not being said.','Noise may be drowning out your inner voice.','☾'],['The Empress','Growth, comfort and creative abundance surround you.','Restore your energy before giving more.','❀'],['The Emperor','Structure and clear boundaries bring stability.','Avoid becoming rigid or controlling.','♜'],['The Hierophant','Wisdom comes through tradition, study or guidance.','Question rules that no longer fit you.','⌘'],['The Lovers','Alignment, meaningful choice and deep connection.','Mixed values need an honest conversation.','♥'],['The Chariot','Focused movement can overcome obstacles.','Slow down and regain direction.','➤'],['Strength','Quiet courage and patience are your advantage.','Do not force what needs gentleness.','♌'],['The Hermit','Step inward to find clarity before moving.','Isolation may be keeping you stuck.','✺'],['Wheel of Fortune','A cycle is turning; stay adaptable.','Resistance to change may create friction.','◎'],['Justice','Truth, balance and accountability matter now.','Check assumptions before judging.','⚖'],['The Hanged Man','A new perspective is more useful than pushing.','Delay without reflection becomes stagnation.','▽'],['Death','A necessary ending creates room for transformation.','Holding on may delay renewal.','✣'],['Temperance','Balance, moderation and integration lead forward.','Extremes are draining your momentum.','⚗'],['The Devil','Notice attachments, habits and tempting shortcuts.','You are ready to loosen an unhealthy pattern.','♑'],['The Tower','A sudden truth can clear unstable ground.','Avoid rebuilding the same weak foundation.','⚡'],['The Star','Hope, healing and renewed direction are available.','Reconnect with faith in your own path.','★'],['The Moon','Not everything is clear yet; move carefully.','Fear may be exaggerating uncertainty.','☽'],['The Sun','Confidence, warmth and visible progress grow.','Celebrate without ignoring practical details.','☀'],['Judgement','Reflection brings a chance to answer a higher call.','Release old self-criticism and decide.','♬'],['The World','Completion, integration and earned progress.','One final detail still needs closure.','⊙']];
var ranks=['Ace','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Page','Knight','Queen','King'];
var suits={Cups:['emotion, relationships and intuition','♡'],Pentacles:['money, stability and practical matters','◈'],Swords:['thoughts, truth and decisions','†'],Wands:['energy, ambition and creative action','✦']};
var deck=[];major.forEach(function(x,i){deck.push({id:'M'+i,name:x[0],up:x[1],rev:x[2],sym:x[3]})});Object.keys(suits).forEach(function(s){ranks.forEach(function(r,i){deck.push({id:s.charAt(0)+i,name:r+' of '+s,up:r+' energy highlights '+suits[s][0]+'. Focus on what can grow through steady awareness.',rev:'The '+r.toLowerCase()+' energy in '+suits[s][0]+' may feel blocked or delayed. Reassess before pushing.',sym:suits[s][1]})})});
function nav(active){var a=[['home','⌂','Home'],['tarot','⌕','Tarot'],['history','▣','History'],['profile','●','Profile']];return '<nav class="bottomnav">'+a.map(function(n){return '<button class="navitem '+(active===n[0]?'active':'')+'" data-route="'+n[0]+'"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join('')+'</nav>'}
function top(t,b){return '<div class="top"><button class="back" data-route="'+b+'" aria-label="Back">‹</button><h1 class="title">'+t+'</h1><div style="width:44px"></div></div>'}
function rowButton(i,t,d,route,action){return '<button class="rowbtn" '+(route?'data-route="'+route+'"':'')+(action?' data-action="'+action+'"':'')+'><div class="rico">'+i+'</div><div class="rmain"><div class="rtitle">'+t+'</div><div class="rdesc">'+d+'</div></div><div class="chev">›</div></button>'}
function rowStatic(i,t,d){return '<div class="rowstatic"><div class="rico">'+i+'</div><div class="rmain"><div class="rtitle">'+t+'</div><div class="rdesc">'+d+'</div></div></div>'}
function snippet(kind,period,extra){var sets={love:['A conversation you have been avoiding may finally bring clarity.','Protect your peace without closing your heart.','A small sign of affection may matter more than a dramatic gesture.','Keep expectations simple and let actions speak.'],career:['Focus on finishing one important task before starting something new.','Your consistency is more valuable than speed today.','A useful opportunity may appear through a simple conversation.','Structure first, expansion second.'],money:['Be cautious with impulsive spending.','Review small recurring expenses before making a larger purchase.','Keep money decisions simple and avoid pressure.','Practical choices support stability.'],energy:['A period of progress and inner clarity. Trust the process.','Move steadily; your energy improves when priorities are clear.','A quieter pace can reveal what actually matters.','Do less, but do it deliberately.']};var arr=sets[kind];return arr[seed(periodKey(period)+kind+(extra||''))%arr.length]}
function splash(){return '<main class="screen no-nav"><div class="moon">☾</div><div class="brand">ORACLY</div><div class="brand-sub">TAROT, ZODIAC & DAILY GUIDANCE</div><div class="hero-copy"><h2>More Clarity<br>A Brighter You</h2><p>Daily guidance for reflection, intuition and mindful choices.</p></div><button class="btn goldbtn" data-action="start">Get Started</button><div class="notice">For entertainment and personal reflection.</div></main>'}
function onboarding(){return '<main class="screen no-nav">'+top('Welcome','splash')+'<div class="moon" style="margin-top:36px">✦</div><div class="hero-copy"><h2>Choose what you need</h2><p>Daily reading, tarot, zodiac guidance, and compatibility — each section is fully interactive.</p></div><button class="btn goldbtn" data-route="home">Enter ORACLY</button></main>'}
function home(){var p=profile();return '<main class="screen"><div class="home-head"><div class="greet">Good Evening,<br>'+esc(p.name||'Seeker')+'<small>Your energy for today is waiting.</small></div><div class="crescent">☾</div></div><div class="menu-grid"><button class="menu-item" data-route="daily"><div class="menu-icon">✧</div>Daily</button><button class="menu-item" data-route="tarot"><div class="menu-icon">▣</div>Tarot</button><button class="menu-item" data-route="horoscope"><div class="menu-icon">☀</div>Horoscope</button><button class="menu-item" data-route="compatibility"><div class="menu-icon">♡</div>Match</button></div><section class="panel goldline"><h3 class="section-title" style="text-align:center">Your Card Today</h3><button class="daily-card-button" data-action="daily-card" aria-label="Reveal today tarot card"><div class="daily-card"><div class="tarot-back">✦</div></div><div class="tap-hint">Tap the card to reveal</div></button><button class="btn goldbtn" data-action="daily-card">Reveal Card</button></section><h3 class="section-title" style="margin-top:18px">Today\'s Energy</h3><div class="energy-row"><div class="energy"><b>♥</b>Love</div><div class="energy"><b>▣</b>Career</div><div class="energy"><b>◉</b>Money</div><div class="energy"><b>☾</b>Mood</div></div></main>'+nav('home')}
function periodTabs(current,action){return '<div class="tabs">'+[['today','Today'],['week','Week'],['month','Month']].map(function(x){return '<button class="tab '+(current===x[0]?'active':'')+'" data-action="'+action+'" data-value="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>'}
function daily(){var p=state.dailyPeriod,key=periodKey(p),n=4+(seed(key)%2),title=p==='today'?"Today's Energy":(p==='week'?"This Week's Energy":"This Month's Energy");return '<main class="screen">'+top('Daily Reading','home')+periodTabs(p,'daily-period')+'<div class="date">'+(p==='today'?new Date().toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'}):(p==='week'?'Current week':'Current month'))+'</div><section class="panel"><div style="text-align:center;color:var(--gold2);font-family:Georgia,serif">'+title+'</div><div class="rating">'+('★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n))+'</div><p class="subtitle" style="text-align:center;color:#ddd3e1">'+snippet('energy',p)+'</p></section><div class="spacer"></div><div class="list">'+rowStatic('♥','Love',snippet('love',p))+rowStatic('▣','Career',snippet('career',p))+rowStatic('◉','Money',snippet('money',p))+'</div><div class="lucky"><div>Lucky Number<strong>'+((seed(key+'n')%9)+1)+'</strong></div><div>Lucky Color<strong>'+['Gold','Violet','Silver','Blue'][seed(key+'c')%4]+'</strong></div><div>Best Time<strong>'+['09:00','14:00','19:00','21:00'][seed(key+'t')%4]+'</strong></div></div></main>'+nav('tarot')}
function tarot(){return '<main class="screen">'+top('Tarot','home')+'<div class="subtitle" style="text-align:center;margin:-8px 0 18px">Choose one reading. Every card shown on the next screen can be tapped.</div><div class="list">'+rowButton('☀','Card of The Day','One card, fixed for today.',null,'tarot-daily')+rowButton('♥','Love Reading','One card focused on relationships.',null,'tarot-love')+rowButton('▣','Career Reading','One card focused on work and direction.',null,'tarot-career')+rowButton('◉','Money Reading','One card focused on financial energy.',null,'tarot-money')+rowButton('☾','Yes / No','One reflective yes / not-yet answer.',null,'tarot-yesno')+rowButton('▱','3 Card Reading','Past · Present · Future.',null,'tarot-three')+'</div></main>'+nav('tarot')}
function tarotPick(){var need=state.mode==='three'?3:1;var labels=need===3?['PAST','PRESENT','FUTURE']:['CHOICE 1','CHOICE 2','CHOICE 3'];return '<main class="screen">'+top(need===3?'Three Card Reading':'Choose a Card','tarot')+'<div class="subtitle" style="text-align:center">Tap '+(need===3?'all three cards':'one card')+'. Selected cards lift upward.</div><div class="three">'+[0,1,2].map(function(i){return '<button class="pick '+(state.draw[i]?'selected':'')+'" data-pick="'+i+'" aria-label="Select card '+(i+1)+'"><div class="tarot-back">✦</div></button>'}).join('')+'</div><div class="pick-labels">'+labels.map(function(x){return '<div>'+x+'</div>'}).join('')+'</div><button class="btn ghostbtn" data-action="shuffle">Shuffle / Reset</button><div class="notice">'+(need===3?'Choose each position once.':'Any of the three cards works — just tap one.')+'</div></main>'+nav('tarot')}
function randomCard(){var used=state.draw.filter(Boolean).map(function(c){return c.id});var c;do{c=deck[Math.floor(Math.random()*deck.length)]}while(used.indexOf(c.id)>=0);return {id:c.id,name:c.name,up:c.up,revText:c.rev,sym:c.sym,reversed:Math.random()<.28}}
function dailyCard(){var c=deck[seed(todayKey())%deck.length];return {id:c.id,name:c.name,up:c.up,revText:c.rev,sym:c.sym,reversed:(seed(todayKey()+'rev')%4===0)}}
function tarotResult(){var cards=state.draw.filter(Boolean);if(!cards.length)cards=[dailyCard()];var labels=cards.length===3?['Past','Present','Future']:['Your Card'];var yes=state.mode==='yesno'?((seed(cards[0].name+todayKey())%2)?'YES — move forward thoughtfully.':'NO / NOT YET — give the situation more space.'):'Use this as a reflection prompt, not a fixed prediction.';return '<main class="screen">'+top('Your Reading','tarot')+'<div class="reading-cards '+(cards.length===1?'one':'')+'">'+cards.map(function(c,i){return '<div><div class="face"><div class="face-art">'+c.sym+'</div><div class="face-name">'+c.name+'</div></div><div class="pos">'+labels[i]+(c.reversed?' · Reversed':'')+'</div></div>'}).join('')+'</div><section class="panel"><div class="reading-text"><strong class="gold">'+yes+'</strong><br><br>'+cards.map(function(c){return '<b>'+c.name+(c.reversed?' (Reversed)':'')+'</b>: '+(c.reversed?c.revText:c.up)}).join('<br><br>')+'</div></section><div class="spacer"></div><button class="btn goldbtn" data-route="tarot">New Reading</button></main>'+nav('history')}
function horoscope(){return '<main class="screen">'+top('Horoscope','home')+'<div class="subtitle" style="text-align:center">Tap your zodiac sign.</div><div class="zodiac-grid">'+signs.map(function(z,i){return '<button class="zodiac" data-zodiac="'+i+'"><div class="zsym">'+z[1]+'</div>'+z[0]+'</button>'}).join('')+'</div></main>'+nav('tarot')}
function horoscopeDetail(){var z=signs[state.zodiac],p=state.horoPeriod,key=periodKey(p)+z[0],base=seed(key),overall=['Take action where your intentions are already clear.','Stay observant; small adjustments can create a smoother path.','Your best results come from patience and selective focus.','Momentum grows when your actions match your values.'][base%4];return '<main class="screen">'+top('Horoscope','horoscope')+'<div class="zodiac-hero"><div class="zsym">'+z[1]+'</div><div><div class="zn">'+z[0]+'</div><div class="subtitle">'+z[2]+'</div></div></div>'+periodTabs(p,'horo-period')+'<div class="list">'+rowStatic('☆','Overall',overall)+rowStatic('♥','Love',snippet('love',p,z[0]))+rowStatic('▣','Career',snippet('career',p,z[0]))+rowStatic('◉','Finance',snippet('money',p,z[0]))+rowStatic('☾','Energy',snippet('energy',p,z[0]))+'</div><div class="lucky"><div>Lucky Number<strong>'+((base%9)+1)+'</strong></div><div>Lucky Color<strong>'+['Gold','Violet','Silver','Blue'][base%4]+'</strong></div><div>Match<strong>'+signs[(base+3)%12][0]+'</strong></div></div><div class="spacer"></div><button class="btn ghostbtn" data-action="save-horoscope">Save This Horoscope</button></main>'+nav('tarot')}
function selectSigns(k,v){return '<select class="input" data-select="'+k+'">'+signs.map(function(z,i){return '<option value="'+i+'" '+(i===v?'selected':'')+'>'+z[0]+'</option>'}).join('')+'</select>'}
function compatibility(){var a=signs[state.a],b=signs[state.b],s=55+(seed(a[0]+b[0])%41),vals=[Math.min(98,s+4),Math.max(45,s-4),Math.min(97,s+2),Math.max(48,s-2)];return '<main class="screen">'+top('Compatibility','home')+'<div class="subtitle" style="text-align:center;margin-bottom:16px">Change either zodiac below. The score updates immediately.</div><div class="compat-hero"><div><div class="zsym">'+a[1]+'</div>'+selectSigns('a',state.a)+'</div><div class="compat-x">×</div><div><div class="zsym">'+b[1]+'</div>'+selectSigns('b',state.b)+'</div></div><div class="score">'+s+'%<small>Match</small></div><div class="bars">'+['Chemistry','Communication','Trust','Long-term'].map(function(x,i){return '<div class="barline"><span>'+x+'</span><div class="bar"><i style="width:'+vals[i]+'%"></i></div><b>'+vals[i]+'%</b></div>'}).join('')+'</div><section class="panel"><div class="reading-text">'+a[0]+' and '+b[0]+' can build a meaningful connection when both people respect differences in pace, communication and emotional needs.</div></section><div class="spacer"></div><button class="btn ghostbtn" data-action="save-compat">Save Compatibility</button></main>'+nav('tarot')}
function signFromDob(d){if(!d)return 4;var dt=new Date(d+'T12:00:00'),m=dt.getMonth()+1,day=dt.getDate(),cuts=[[1,20,9,10],[2,19,10,11],[3,21,11,0],[4,20,0,1],[5,21,1,2],[6,21,2,3],[7,23,3,4],[8,23,4,5],[9,23,5,6],[10,23,6,7],[11,22,7,8],[12,22,8,9]],r=cuts[m-1];return day<r[1]?r[2]:r[3]}
function birth(){var p=profile();return '<main class="screen">'+top('Birth Profile','profile')+'<div class="form"><label class="label">Name<input id="pname" class="input" value="'+esc(p.name||'')+'"></label><label class="label">Date of Birth<input id="pdob" type="date" class="input" value="'+esc(p.dob||'')+'"></label><label class="label">Time of Birth (Optional)<input id="ptime" type="time" class="input" value="'+esc(p.time||'')+'"></label><label class="label">Gender (Optional)<select id="pgender" class="input"><option '+(p.gender==='Male'?'selected':'')+'>Male</option><option '+(p.gender==='Female'?'selected':'')+'>Female</option><option '+(p.gender==='Prefer not to say'?'selected':'')+'>Prefer not to say</option></select></label></div><div class="spacer"></div><button class="btn goldbtn" data-action="save-profile">Generate My Profile</button></main>'+nav('profile')}
function birthResult(){var p=profile(),i=signFromDob(p.dob),z=signs[i],planets={Aries:'Mars',Taurus:'Venus',Gemini:'Mercury',Cancer:'Moon',Leo:'Sun',Virgo:'Mercury',Libra:'Venus',Scorpio:'Pluto',Sagittarius:'Jupiter',Capricorn:'Saturn',Aquarius:'Uranus',Pisces:'Neptune'},traits={Fire:'Confident · Active · Expressive',Earth:'Grounded · Loyal · Practical',Air:'Curious · Social · Analytical',Water:'Intuitive · Sensitive · Deep'};return '<main class="screen">'+top('Your Profile','profile')+'<div class="profile-card"><div class="avatar">'+z[1]+'</div><div><div class="subtitle">Sun Sign</div><div class="title">'+z[0]+'</div></div></div><div class="traitgrid"><div class="trait">Element<strong>'+z[3]+'</strong></div><div class="trait">Ruling Planet<strong>'+planets[z[0]]+'</strong></div></div><div class="panel">'+traits[z[3]]+'</div><div class="spacer"></div><button class="btn goldbtn" data-route="profile">Done</button></main>'+nav('profile')}
function historyPage(){var f=state.historyFilter,h=histories().filter(function(x){return f==='all'||x.type===f});return '<main class="screen">'+top('My Readings','home')+'<div class="tabs">'+[['all','All'],['tarot','Tarot'],['horoscope','Horoscope'],['compat','Match']].map(function(x){return '<button class="tab '+(f===x[0]?'active':'')+'" data-action="history-filter" data-value="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div><div class="list">'+(h.length?h.map(function(x){return rowStatic(x.type==='tarot'?'▱':(x.type==='horoscope'?'☀':'♡'),x.title,new Date(x.date).toLocaleDateString()+' · '+x.detail)}).join(''):'<div class="panel empty">No saved items in this category yet.</div>')+'</div></main>'+nav('history')}
function profilePage(){var p=profile(),z=signs[signFromDob(p.dob)];return '<main class="screen"><div class="top"><div></div><h1 class="title">Profile</h1><div style="width:44px"></div></div><div class="profile-card" style="display:block;text-align:center"><div class="avatar" style="margin:auto">'+z[1]+'</div><div class="title" style="font-size:20px;margin-top:8px">'+esc(p.name||'Seeker')+'</div><div class="subtitle">'+z[0]+(p.dob?' · '+esc(p.dob):' · Add birth date')+'</div></div><button class="premium-banner" data-route="premium"><span>♛ ORACLY+</span><small>Preview ›</small></button><div class="list">'+rowButton('▣','My Readings','Saved tarot, horoscope and compatibility.','history')+rowButton('✦','Birth Profile','Edit your birth data.','birth')+rowButton('ⓘ','About ORACLY','Version and product information.','about')+rowButton('↻','Reset App Data','Clear profile, history and onboarding.',null,'reset-data')+'</div></main>'+nav('profile')}
function about(){return '<main class="screen">'+top('About ORACLY','profile')+'<section class="panel"><div class="title" style="font-size:22px">ORACLY</div><p class="subtitle">Tarot, Zodiac & Daily Guidance</p><p class="subtitle">Build 0.1.4 candidate. Readings are for entertainment and personal reflection.</p><span class="status-pill">Offline-first MVP</span></section></main>'+nav('profile')}
function premium(){return '<main class="screen">'+top('ORACLY+ Preview','profile')+'<div class="moon" style="width:130px;height:130px;margin:24px auto 12px;font-size:80px">☾</div><ul class="premium-list"><li>Unlimited advanced spreads</li><li>Weekly & monthly deep readings</li><li>Detailed compatibility</li><li>Premium tarot decks</li><li>No ads</li></ul><div class="panel"><div class="rtitle">Planned pricing</div><div class="subtitle" style="margin-top:8px">Rp 19.000 / month · Rp 149.000 / year</div></div><div class="notice">Checkout is intentionally not shown until payment integration is actually ready.</div></main>'+nav('profile')}
function route(p){state.page=p;render();try{window.scrollTo(0,0)}catch(e){}}
function render(){var p=state.page;if(!get('oracly_onboarded','')&&p==='home')p='splash';var pages={splash:splash,onboarding:onboarding,home:home,daily:daily,tarot:tarot,'tarot-pick':tarotPick,'tarot-result':tarotResult,horoscope:horoscope,'horoscope-detail':horoscopeDetail,compatibility:compatibility,birth:birth,'birth-result':birthResult,history:historyPage,profile:profilePage,about:about,premium:premium};var fn=pages[p]||home;app.innerHTML='<div class="stars"></div>'+fn()}
function startTarot(mode){if(mode==='daily'){var c=dailyCard();state.mode='daily';state.draw=[c];addHistory('tarot','Card of the Day',c.name+(c.reversed?' (R)':''));route('tarot-result');return}state.mode=mode;state.draw=[];route('tarot-pick')}
function chooseCard(i){var need=state.mode==='three'?3:1;if(state.draw[i])return;state.draw[i]=randomCard();render();if(state.draw.filter(Boolean).length>=need){setTimeout(function(){var cards=state.draw.filter(Boolean);addHistory('tarot',state.mode==='three'?'Three Card Reading':state.mode.charAt(0).toUpperCase()+state.mode.slice(1)+' Reading',cards.map(function(c){return c.name+(c.reversed?' (R)':'')}).join(' · '));route('tarot-result')},220)}}
app.addEventListener('click',function(e){var el=e.target.closest('button,[data-route],[data-action],[data-pick],[data-zodiac]');if(!el||!app.contains(el))return;var r=el.getAttribute('data-route');if(r){route(r);return}var z=el.getAttribute('data-zodiac');if(z!==null){state.zodiac=parseInt(z,10);route('horoscope-detail');return}var pick=el.getAttribute('data-pick');if(pick!==null){chooseCard(parseInt(pick,10));return}var a=el.getAttribute('data-action');if(!a)return;if(a==='start'){set('oracly_onboarded','1');route('onboarding')}else if(a==='daily-card'){startTarot('daily')}else if(a.indexOf('tarot-')===0){startTarot(a.slice(6))}else if(a==='shuffle'){state.draw=[];render()}else if(a==='daily-period'){state.dailyPeriod=el.getAttribute('data-value');render()}else if(a==='horo-period'){state.horoPeriod=el.getAttribute('data-value');render()}else if(a==='history-filter'){state.historyFilter=el.getAttribute('data-value');render()}else if(a==='save-profile'){var name=document.getElementById('pname').value.trim()||'Seeker',dob=document.getElementById('pdob').value,time=document.getElementById('ptime').value,gender=document.getElementById('pgender').value;set('oracly_profile',JSON.stringify({name:name,dob:dob,time:time,gender:gender}));state.zodiac=signFromDob(dob);route('birth-result')}else if(a==='save-horoscope'){var zz=signs[state.zodiac][0];addHistory('horoscope',zz+' Horoscope',state.horoPeriod+' · '+snippet('energy',state.horoPeriod,zz));el.textContent='Saved';el.disabled=true}else if(a==='save-compat'){var aa=signs[state.a][0],bb=signs[state.b][0],score=55+(seed(aa+bb)%41);addHistory('compat',aa+' × '+bb,score+'% match');el.textContent='Saved';el.disabled=true}else if(a==='reset-data'){if(confirm('Clear ORACLY profile, saved readings and onboarding?')){del('oracly_profile');del('oracly_history');del('oracly_onboarded');state={page:'home',mode:'three',draw:[],zodiac:4,a:4,b:7,dailyPeriod:'today',horoPeriod:'today',historyFilter:'all'};render()}}});
app.addEventListener('change',function(e){var el=e.target;if(el.matches('[data-select]')){state[el.getAttribute('data-select')]=parseInt(el.value,10);render()}});
window.addEventListener('error',function(ev){console.error('ORACLY_RUNTIME',ev.message)});
try{render()}catch(err){console.error(err);app.innerHTML='<main class="screen no-nav"><div class="panel"><div class="title">ORACLY</div><p class="subtitle">Startup error. This candidate should not be used.</p><div class="notice">'+esc(err.message||String(err))+'</div></div></main>'}
})();
</script>
