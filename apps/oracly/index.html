lid #342941;background:linear-gradient(180deg,#1b152b,#100d18);border-radius:14px;display:grid;place-items:center;font-size:23px;margin-bottom:7px}.panel{background:linear-gradient(180deg,#171220,#100d17);border:1px solid #3a3048;border-radius:18px;padding:16px;box-shadow:0 14px 30px #0004}.panel.goldline{border-color:#735a34}.section-title{font-family:Georgia,serif;font-size:19px;margin:0 0 12px}.daily-card{height:200px;display:grid;place-items:center;text-align:center;overflow:hidden;position:relative}.tarot-back{width:86px;height:132px;border-radius:12px;border:2px solid #b9904d;background:radial-gradient(circle at 50% 50%,#aa7e35 0 2px,transparent 3px),repeating-radial-gradient(circle at 50% 50%,transparent 0 10px,#47315d 11px 12px),linear-gradient(145deg,#17102d,#090713);position:relative;display:grid;place-items:center;color:#f2d789;font-size:30px;box-shadow:0 15px 35px #0009}.tarot-back:after{content:"✦";font-size:22px}.energy-row{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.energy{text-align:center;font-size:10px;color:#c9bfcd}.energy b{display:grid;place-items:center;margin:0 auto 6px;width:38px;height:38px;border-radius:50%;background:#191328;border:1px solid #392b4f;font-size:18px}.bottomnav{position:fixed;z-index:20;bottom:0;width:100%;max-width:460px;display:grid;grid-template-columns:repeat(4,1fr);background:#090810f2;backdrop-filter:blur(18px);border-top:1px solid #241d31;padding:9px 8px calc(9px + var(--safe))}.navitem{border:0;background:transparent;color:#8d8499;font-size:10px;padding:4px}.navitem span{display:block;font-size:20px;margin-bottom:2px}.navitem.active{color:var(--gold2)}.tabs{display:flex;background:#171320;border:1px solid #2e263c;border-radius:16px;padding:3px;margin-bottom:14px}.tab{flex:1;border:0;background:transparent;color:#aaa1b3;padding:9px;border-radius:13px}.tab.active{background:linear-gradient(180deg,#f3d48c,#c99a45);color:#19100a;font-weight:800}.date{text-align:center;color:#aca2b6;font-size:12px;margin:-4px 0 14px}.rating{text-align:center;font-size:24px;color:var(--gold2);letter-spacing:2px}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;gap:12px;border:1px solid #342b43;background:#15111e;border-radius:14px;padding:12px}.row .r-ico{flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:#221830;display:grid;place-items:center;font-size:22px}.row .r-main{flex:1;min-width:0}.row .r-title{font-family:Georgia,serif;font-size:16px}.row .r-desc{font-size:11px;color:#aaa0b3;margin-top:3px;line-height:1.35}.row .chev{color:var(--gold2);font-size:20px}.lucky{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;border:1px solid #30263f;border-radius:14px;overflow:hidden}.lucky>div{background:#110e18;padding:11px 6px;text-align:center;font-size:11px}.lucky strong{display:block;color:var(--gold2);font-size:16px;margin-top:4px}.tarot-menu .row{padding:14px}.tarot-menu .r-ico{background:transparent;border:1px solid #4a3758;color:var(--gold2)}.three-wrap{display:flex;justify-content:center;gap:12px;margin:36px 0 30px}.choose-card{width:30%;max-width:118px;height:190px;transition:.25s;cursor:pointer}.choose-card.selected{transform:translateY(-18px);filter:drop-shadow(0 0 14px #d8b15e55)}.choose-card .tarot-back{width:100%;height:100%}.tip{display:flex;gap:11px;align-items:flex-start;margin-top:16px}.tip b{font-size:20px;color:var(--gold2)}.reading-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.face{border:1px solid #80643b;border-radius:10px;overflow:hidden;background:#151022}.face-art{height:124px;background:radial-gradient(circle at 50% 35%,#d3ae58 0 4px,transparent 5px),linear-gradient(160deg,#3c274f,#12101d 55%,#5e4625);display:grid;place-items:center;font-size:38px;color:#f5dc97}.face-name{font-size:10px;font-weight:800;text-align:center;padding:7px 3px;background:#e6c36e;color:#17100a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pos{text-align:center;color:#a99fb1;font-size:11px;margin-top:5px}.reading-text{font-family:Georgia,serif;line-height:1.55;color:#ded4e1;font-size:14px}.zodiac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px;margin-top:22px}.zodiac{text-align:center;color:#d8cedc;font-size:12px;cursor:pointer}.zsym{width:60px;height:60px;margin:0 auto 7px;border-radius:50%;border:1px solid #8f7042;display:grid;place-items:center;color:var(--gold2);font-size:29px;background:#100d17}.zodiac-hero{display:flex;align-items:center;gap:13px;margin-bottom:12px}.zodiac-hero .zsym{margin:0;width:58px;height:58px}.zodiac-hero .zn{font-family:Georgia,serif;font-size:24px}.bars{display:flex;flex-direction:column;gap:12px;margin:18px 0}.barline{display:grid;grid-template-columns:92px 1fr 38px;gap:8px;align-items:center;font-size:12px}.bar{height:7px;border-radius:9px;background:#292033;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a4ab8,#b66df0)}.compat-hero{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;text-align:center;margin:14px 0 20px}.compat-hero .zsym{width:76px;height:76px}.compat-x{font-size:30px;color:#c99f55}.score{text-align:center;font-family:Georgia,serif;color:var(--gold2);font-size:40px;margin:6px 0}.score small{display:block;font-family:Inter,sans-serif;color:#d8cfdc;font-size:14px}.form{display:flex;flex-direction:column;gap:12px}.label{font-size:12px;color:#c7bccb}.input{width:100%;margin-top:6px;border:1px solid #30283d;background:#14101d;color:#f7f2f7;border-radius:10px;padding:12px 13px;outline:none}.profile-card{display:flex;gap:14px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;border:1px solid #8e7040;background:radial-gradient(circle at 50% 30%,#33214e,#0d0b13 72%);display:grid;place-items:center;font-size:35px}.traitgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.trait{border:1px solid #31283f;border-radius:12px;background:#14101d;padding:11px;font-size:11px;color:#a89fb1}.trait strong{display:block;color:#eee4ed;font-size:14px;margin-top:4px}.history-row{cursor:pointer}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#2a1b3f;color:#d4b2ff;font-size:10px}.premium-banner{background:linear-gradient(90deg,#f0ca72,#d29c3e);color:#171008;border-radius:12px;padding:13px;display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:16px 0}.premium-list{list-style:none;padding:0;margin:18px 0}.premium-list li{padding:8px 0;border-bottom:1px solid #251c31}.premium-list li:before{content:"✓";color:var(--gold2);margin-right:10px}.price{border:1px solid #4a365d;background:#171022;border-radius:14px;padding:14px;margin:10px 0;display:flex;justify-content:space-between}.notice{font-size:11px;color:#8f8699;text-align:center;line-height:1.5;margin-top:14px}.hide{display:none!important}

<div id="app" class="app"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const signs=[
['Aries','♈','21 Mar – 19 Apr','Fire'],['Taurus','♉','20 Apr – 20 May','Earth'],['Gemini','♊','21 May – 20 Jun','Air'],['Cancer','♋','21 Jun – 22 Jul','Water'],['Leo','♌','23 Jul – 22 Aug','Fire'],['Virgo','♍','23 Aug – 22 Sep','Earth'],['Libra','♎','23 Sep – 22 Oct','Air'],['Scorpio','♏','23 Oct – 21 Nov','Water'],['Sagittarius','♐','22 Nov – 21 Dec','Fire'],['Capricorn','♑','22 Dec – 19 Jan','Earth'],['Aquarius','♒','20 Jan – 18 Feb','Air'],['Pisces','♓','19 Feb – 20 Mar','Water']];
const major=[
['The Fool','New beginnings, openness and a leap of faith.','Pause before acting on impulse.','✦'],['The Magician','Use your skills and resources with intention.','Scattered focus can weaken your progress.','✧'],['The High Priestess','Trust intuition and observe what is not being said.','Noise may be drowning out your inner voice.','☾'],['The Empress','Growth, comfort and creative abundance surround you.','Restore your energy before giving more.','❀'],['The Emperor','Structure and clear boundaries bring stability.','Avoid becoming rigid or controlling.','♜'],['The Hierophant','Wisdom comes through tradition, study or guidance.','Question rules that no longer fit you.','⌘'],['The Lovers','Alignment, meaningful choice and deep connection.','Mixed values need an honest conversation.','♥'],['The Chariot','Focused movement can overcome obstacles.','Slow down and regain direction.','➤'],['Strength','Quiet courage and patience are your advantage.','Do not force what needs gentleness.','♌'],['The Hermit','Step inward to find clarity before moving.','Isolation may be keeping you stuck.','✺'],['Wheel of Fortune','A cycle is turning; stay adaptable.','Resistance to change may create friction.','◎'],['Justice','Truth, balance and accountability matter now.','Check assumptions before judging.','⚖'],['The Hanged Man','A new perspective is more useful than pushing.','Delay without reflection becomes stagnation.','▽'],['Death','A necessary ending creates room for transformation.','Holding on may delay renewal.','✣'],['Temperance','Balance, moderation and integration lead forward.','Extremes are draining your momentum.','⚗'],['The Devil','Notice attachments, habits and tempting shortcuts.','You are ready to loosen an unhealthy pattern.','♑'],['The Tower','A sudden truth can clear unstable ground.','Avoid rebuilding the same weak foundation.','⚡'],['The Star','Hope, healing and renewed direction are available.','Reconnect with faith in your own path.','★'],['The Moon','Not everything is clear yet; move carefully.','Fear may be exaggerating uncertainty.','☽'],['The Sun','Confidence, warmth and visible progress grow.','Celebrate without ignoring practical details.','☀'],['Judgement','Reflection brings a chance to answer a higher call.','Release old self-criticism and decide.','♬'],['The World','Completion, integration and earned progress.','One final detail still needs closure.','⊙']];
const suits={Cups:['emotion, relationships and intuition','♡'],Pentacles:['money, stability and practical matters','◈'],Swords:['thoughts, truth and decisions','†'],Wands:['energy, ambition and creative action','✦']};
const ranks=['Ace','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Page','Knight','Queen','King'];
function buildDeck(){let d=major.map((x,i)=>({name:x[0],up:x[1],rev:x[2],sym:x[3],id:'M'+i}));Object.entries(suits).forEach(([s,[theme,sym]])=>ranks.forEach((r,i)=>d.push({name:`${r} of ${s}`,up:`${r} energy highlights ${theme}. Focus on what can grow through steady awareness.`,rev:`The ${r.toLowerCase()} energy in ${theme} may feel blocked or delayed. Reassess before pushing.`,sym,id:s[0]+i})));return d}const deck=buildDeck();
const state={page:'home',tarotMode:'three',draw:[],zodiac:4,compatA:4,compatB:7,dailyTab:'today'};
const profile=()=>JSON.parse(localStorage.getItem('oracly_profile')||'{"name":"Arda","dob":"1998-04-12","time":"14:30","gender":"Male"}');
const histories=()=>JSON.parse(localStorage.getItem('oracly_history')||'[]');
function saveHistory(type,title,detail){let h=histories();h.unshift({id:Date.now(),type,title,detail,date:new Date().toISOString()});localStorage.setItem('oracly_history',JSON.stringify(h.slice(0,50)))}
function seed(str){let h=2166136261;for(let c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return Math.abs(h)}
function todayKey(){return new Date().toISOString().slice(0,10)}
function nav(active='home'){return `<nav class="bottomnav">${[['home','⌂','Home'],['explore','⌕','Explore'],['history','▣','History'],['profile','●','Profile']].map(n=>`<button class="navitem ${active===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav>`}
function go(p){state.page=p;render();scrollTo(0,0)}
function top(title,back='home',extra=''){return `<div class="top"><button class="back" onclick="go('${back}')">‹</button><h1 class="title">${title}</h1><div style="min-width:38px">${extra}</div></div>`}
function cardOfDay(){return deck[seed(todayKey())%deck.length]}
function readingSnippet(key){const sets={love:['A conversation you have been avoiding may finally bring clarity.','Be open to a softer approach; connection grows through honesty.','Protect your peace without closing your heart.','A small sign of affection may matter more than a dramatic gesture.'],career:['Focus on finishing one important task before starting something new.','A practical idea deserves a structured next step.','Your consistency is more valuable than speed today.','A useful opportunity may appear through a simple conversation.'],money:['Be cautious with impulsive spending today.','Review small recurring expenses before making a larger purchase.','Stability improves when you choose the practical option.','Keep money decisions simple and avoid pressure.'],energy:['A day of progress and inner clarity. Trust the process.','Move steadily; your energy improves when your priorities are clear.','Choose calm focus over scattered effort.','A quieter pace can reveal what actually matters.']};let a=sets[key];return a[seed(todayKey()+key)%a.length]}
function splash(){return `<main class="screen no-nav"><div class="moon"></div><div class="brand">ORACLY</div><div class="brand-sub">TAROT, ZODIAC & DAILY GUIDANCE</div><div class="hero-copy"><h2>More Clarity<br>A Brighter You</h2><p>Daily guidance designed for reflection, intuition and mindful choices.</p></div><button class="btn btn-gold" onclick="localStorage.setItem('oracly_onboarded','1');state.page='onboarding';render()">Get Started</button><div class="notice">For entertainment and personal reflection.</div></main>`}
function onboarding(){return `<main class="screen no-nav"><div class="top"><div></div><button class="back" style="font-size:14px;color:var(--gold2)" onclick="go('home')">Skip</button></div><div class="onboard-art"><div class="fan"><div class="mini-card">☀</div><div class="mini-card">◉</div><div class="mini-card">✦</div><div class="mini-card">☾</div></div><div class="handline"></div></div><div class="hero-copy" style="text-align:left;margin-left:0"><h2>Find Guidance<br>Every Day</h2><p>Tarot, Horoscope, and Daily Insights in one calm, premium space.</p></div><div class="dots"><i class="dot active"></i><i class="dot"></i><i class="dot"></i></div><button class="btn btn-gold" onclick="go('home')">Continue</button></main>`}
function home(){let p=profile(),c=cardOfDay();return `<main class="screen"><div class="home-head"><div class="greet">Good Evening,<br>${p.name||'Seeker'}<small>Your energy for today is waiting.</small></div><div class="crescent">☾</div></div><div class="menu-grid"><div class="menu-item" onclick="go('daily')"><div class="menu-icon">✧</div>Daily Reading</div><div class="menu-item" onclick="go('tarot')"><div class="menu-icon">▣</div>Tarot</div><div class="menu-item" onclick="go('horoscope')"><div class="menu-icon">☀</div>Horoscope</div><div class="menu-item" onclick="go('compatibility')"><div class="menu-icon">♡</div>Compatibility</div></div><section class="panel goldline"><h3 class="section-title" style="text-align:center">Your Card Today</h3><div class="daily-card"><div class="tarot-back"></div></div><button class="btn btn-gold" onclick="revealDaily()">Reveal Card</button></section><h3 class="section-title" style="margin-top:18px">Today's Energy</h3><div class="energy-row"><div class="energy"><b>♥</b>Love</div><div class="energy"><b>▣</b>Career</div><div class="energy"><b>◉</b>Money</div><div class="energy"><b>☾</b>Mood</div></div></main>${nav('home')}`}
function revealDaily(){let c=cardOfDay(), rev=seed(todayKey()+'rev')%4===0;state.draw=[{...c,rev}];state.tarotMode='daily';saveHistory('Tarot','Card of the Day',`${c.name}${rev?' · Reversed':''}`);go('tarot-result')}
function daily(){let n=seed(todayKey())%4+4;return `<main class="screen">${top('Daily Reading','home','<span style="font-size:18px">⌯</span>')}<div class="tabs"><button class="tab active">Today</button><button class="tab">Week</button><button class="tab">Month</button></div><div class="date">${new Date().toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'})}</div><section class="panel"><div style="text-align:center;color:var(--gold2);font-family:Georgia,serif">Today's Energy</div><div class="rating">${'★'.repeat(Math.min(5,n))}${'☆'.repeat(Math.max(0,5-n))}</div><p class="subtitle" style="text-align:center;color:#ddd3e1">${readingSnippet('energy')}</p></section><div class="spacer"></div><div class="list"><div class="row"><div class="r-ico">♥</div><div class="r-main"><div class="r-title">Love</div><div class="r-desc">${readingSnippet('love')}</div></div></div><div class="row"><div class="r-ico">▣</div><div class="r-main"><div class="r-title">Career</div><div class="r-desc">${readingSnippet('career')}</div></div></div><div class="row"><div class="r-ico">◉</div><div class="r-main"><div class="r-title">Money</div><div class="r-desc">${readingSnippet('money')}</div></div></div></div><div class="lucky"><div>Lucky Number<strong>${seed(todayKey()+'n')%9+1}</strong></div><div>Lucky Color<strong>${['Gold','Violet','Silver','Blue'][seed(todayKey()+'c')%4]}</strong></div><div>Best Time<strong>${['09:00','14:00','19:00','21:00'][seed(todayKey()+'t')%4]}</strong></div></div></main>${nav('explore')}`}
function tarot(){return `<main class="screen tarot-menu">${top('Tarot','home')}<div class="subtitle" style="text-align:center;margin:-8px 0 18px">Choose Your Reading</div><div class="list">${[['☀','Card of The Day','A simple guidance for today.','daily'],['♥','Love Reading','Insights about your love life.','love'],['▣','Career Reading','Guidance for your career.','career'],['◉','Money Reading','See your financial energy.','money'],['☾','Yes / No','Get a clear reflective answer.','yesno'],['▱','3 Card Reading','Past · Present · Future','three']].map(x=>`<div class="row" onclick="startTarot('${x[3]}')"><div class="r-ico">${x[0]}</div><div class="r-main"><div class="r-title">${x[1]}</div><div class="r-desc">${x[2]}</div></div><div class="chev">›</div></div>`).join('')}</div></main>${nav('explore')}`}
function startTarot(mode){if(mode==='daily'){revealDaily();return}state.tarotMode=mode;state.draw=[];go(mode==='three'?'tarot-pick':'tarot-pick')}
function tarotPick(){return `<main class="screen">${top(state.tarotMode==='three'?'Three Card Reading':'Choose a Card','tarot')}<div class="subtitle" style="text-align:center">Focus on your question, then choose ${state.tarotMode==='three'?'three':'one'} card${state.tarotMode==='three'?'s':''}.</div><div class="three-wrap">${[0,1,2].map(i=>`<div class="choose-card ${state.draw[i]?'selected':''}" onclick="pickCard(${i})"><div class="tarot-back"></div></div>`).join('')}</div><button class="btn btn-gold" onclick="shuffleCards()">Shuffle Cards</button><div class="panel tip"><b>♧</b><div><strong>Tips</strong><div class="subtitle">Take a deep breath, trust your intuition, and choose naturally.</div></div></div></main>${nav('explore')}`}
function randomCard(exclude=[]){let c;do{c=deck[Math.floor(Math.random()*deck.length)]}while(exclude.includes(c.id));return {...c,rev:Math.random()<.28}}
function pickCard(i){let need=state.tarotMode==='three'?3:1;if(state.draw[i]) return;let c=randomCard(state.draw.filter(Boolean).map(x=>x.id));state.draw[i]=c;render();if(state.draw.filter(Boolean).length>=need)setTimeout(()=>finishTarot(),250)}
function shuffleCards(){state.draw=[];render()}
function finishTarot(){let cards=state.draw.filter(Boolean);let title=state.tarotMode==='three'?'Three Card Reading':state.tarotMode.charAt(0).toUpperCase()+state.tarotMode.slice(1)+' Reading';saveHistory('Tarot',title,cards.map(c=>c.name+(c.rev?' (R)':'')).join(' · '));go('tarot-result')}
function tarotResult(){let cards=state.draw.length?state.draw.filter(Boolean):[{...cardOfDay(),rev:false}];let labels=cards.length===3?['Past','Present','Future']:['Your Card'];let intro=state.tarotMode==='yesno'?((seed(cards[0].name+todayKey())%2)?'YES — move forward thoughtfully.':'NO / NOT YET — give the situation more space.'):'Your cards suggest a theme to reflect on rather than a fixed prediction.';return `<main class="screen">${top('Your Reading','tarot','<span style="font-size:18px">⌯</span>')}<div class="subtitle" style="text-align:center;margin-top:-8px">${cards.length===3?'Past · Present · Future':'Personal Guidance'}</div><div class="reading-cards">${cards.map((c,i)=>`<div><div class="face"><div class="face-art">${c.sym}</div><div class="face-name">${c.name}</div></div><div class="pos">${labels[i]}${c.rev?' · Reversed':''}</div></div>`).join('')}</div><section class="panel"><div class="reading-text"><strong class="gold">${intro}</strong><br><br>${cards.map(c=>`<b>${c.name}${c.rev?' (Reversed)':''}</b>: ${c.rev?c.rev:c.up}`).join('<br><br>')}</div></section><div class="spacer"></div><button class="btn btn-gold" onclick="go('tarot')">New Reading</button></main>${nav('history')}`}
function horoscope(){return `<main class="screen">${top('Horoscope','home')}<div class="zodiac-grid">${signs.map((z,i)=>`<div class="zodiac" onclick="state.zodiac=${i};go('horoscope-detail')"><div class="zsym">${z[1]}</div>${z[0]}</div>`).join('')}</div></main>${nav('explore')}`}
function horoscopeDetail(){let z=signs[state.zodiac], base=seed(todayKey()+z[0]);let overall=['A powerful day to take action and express your true self.','Stay observant; small adjustments can create a smoother day.','Your best results come from patience and selective focus.','Momentum grows when your actions match your values.'][base%4];return `<main class="screen">${top('', 'horoscope')}<div class="zodiac-hero"><div class="zsym">${z[1]}</div><div><div class="zn">${z[0]}</div><div class="subtitle">${z[2]}</div></div></div><div class="tabs"><button class="tab active">Today</button><button class="tab">Week</button><button class="tab">Month</button></div><div class="date">${new Date().toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'})}</div><div class="list"><div class="row"><div class="r-ico">☆</div><div class="r-main"><div class="r-title">Overall</div><div class="r-desc">${overall}</div></div></div><div class="row"><div class="r-ico">♥</div><div class="r-main"><div class="r-title">Love</div><div class="r-desc">${readingSnippet('love')}</div></div></div><div class="row"><div class="r-ico">▣</div><div class="r-main"><div class="r-title">Career</div><div class="r-desc">${readingSnippet('career')}</div></div></div><div class="row"><div class="r-ico">◉</div><div class="r-main"><div class="r-title">Finance</div><div class="r-desc">${readingSnippet('money')}</div></div></div><div class="row"><div class="r-ico">☾</div><div class="r-main"><div class="r-title">Energy</div><div class="r-desc">Choose a sustainable pace and make room for rest.</div></div></div></div><div class="lucky"><div>Lucky Number<strong>${base%9+1}</strong></div><div>Lucky Color<strong>${['Gold','Violet','Silver','Blue'][base%4]}</strong></div><div>Compatibility<strong>${signs[(base+3)%12][0]}</strong></div></div></main>${nav('explore')}`}
function compatibility(){let a=signs[state.compatA],b=signs[state.compatB];let s=55+(seed(a[0]+b[0])%41), vals=[Math.min(98,s+4),Math.max(45,s-4),Math.min(97,s+2),Math.max(48,s-2)];return `<main class="screen">${top('Compatibility','home')}<div class="compat-hero"><div><div class="zsym">${a[1]}</div><select class="input" onchange="state.compatA=+this.value;render()">${signs.map((z,i)=>`<option value="${i}" ${i===state.compatA?'selected':''}>${z[0]}</option>`).join('')}</select></div><div class="compat-x">×</div><div><div class="zsym">${b[1]}</div><select class="input" onchange="state.compatB=+this.value;render()">${signs.map((z,i)=>`<option value="${i}" ${i===state.compatB?'selected':''}>${z[0]}</option>`).join('')}</select></div></div><div class="score">${s}%<small>Match</small></div><div class="bars">${['Chemistry','Communication','Trust','Long-term'].map((x,i)=>`<div class="barline"><span>${x}</span><div class="bar"><i style="width:${vals[i]}%"></i></div><b>${vals[i]}%</b></div>`).join('')}</div><section class="panel"><div class="reading-text">${a[0]} and ${b[0]} can build a meaningful connection when both people respect differences in pace, communication and emotional needs. Use this score as reflection, not certainty.</div></section></main>${nav('explore')}`}
function signFromDob(d){if(!d)return 4;let dt=new Date(d+'T12:00:00'),m=dt.getMonth()+1,day=dt.getDate();let cuts=[[1,20,9,10],[2,19,10,11],[3,21,11,0],[4,20,0,1],[5,21,1,2],[6,21,2,3],[7,23,3,4],[8,23,4,5],[9,23,5,6],[10,23,6,7],[11,22,7,8],[12,22,8,9]];let r=cuts.find(x=>x[0]===m);return day<r[1]?r[2]:r[3]}
function birth(){let p=profile();return `<main class="screen">${top('Birth Profile','profile')}<div class="form"><label class="label">Name<input id="pname" class="input" value="${p.name||''}"></label><label class="label">Date of Birth<input id="pdob" type="date" class="input" value="${p.dob||''}"></label><label class="label">Time of Birth (Optional)<input id="ptime" type="time" class="input" value="${p.time||''}"></label><label class="label">Gender (Optional)<select id="pgender" class="input"><option ${p.gender==='Male'?'selected':''}>Male</option><option ${p.gender==='Female'?'selected':''}>Female</option><option ${p.gender==='Prefer not to say'?'selected':''}>Prefer not to say</option></select></label></div><div class="spacer"></div><button class="btn btn-gold" onclick="saveProfile()">Generate My Profile</button></main>${nav('profile')}`}
function saveProfile(){let p={name:$('#pname').value.trim()||'Seeker',dob:$('#pdob').value,time:$('#ptime').value,gender:$('#pgender').value};localStorage.setItem('oracly_profile',JSON.stringify(p));state.zodiac=signFromDob(p.dob);go('birth-result')}
function birthResult(){let p=profile(),i=signFromDob(p.dob),z=signs[i], planet={Aries:'Mars',Taurus:'Venus',Gemini:'Mercury',Cancer:'Moon',Leo:'Sun',Virgo:'Mercury',Libra:'Venus',Scorpio:'Pluto',Sagittarius:'Jupiter',Capricorn:'Saturn',Aquarius:'Uranus',Pisces:'Neptune'}[z[0]];return `<main class="screen">${top('Your Profile','profile')}<div class="profile-card"><div class="avatar">${z[1]}</div><div><div class="subtitle">Sun Sign</div><div class="title">${z[0]}</div></div></div><div class="traitgrid"><div class="trait">Element<strong>${z[3]}</strong></div><div class="trait">Ruling Planet<strong>${planet}</strong></div></div><div class="panel"><div class="subtitle">Traits</div><div style="margin-top:6px">${{Fire:'Confident · Active · Expressive',Earth:'Grounded · Loyal · Practical',Air:'Curious · Social · Analytical',Water:'Intuitive · Sensitive · Deep'}[z[3]]}</div></div><div class="spacer"></div><section class="panel"><div class="reading-text">Your ${z[0]} profile points toward ${z[3].toLowerCase()} energy. Use it as a lens for self-reflection rather than a fixed definition of who you are.</div></section><div class="spacer"></div><button class="btn btn-gold" onclick="go('profile')">Save to Profile</button></main>${nav('profile')}`}
function history(){let h=histories();return `<main class="screen">${top('My Readings','home')}<div class="tabs"><button class="tab active">All</button><button class="tab">Tarot</button><button class="tab">Horoscope</button><button class="tab">Daily</button></div><div class="list">${h.length?h.map(x=>`<div class="row history-row"><div class="r-ico">${x.type==='Tarot'?'▱':'✦'}</div><div class="r-main"><div class="r-title">${x.title}</div><div class="r-desc">${new Date(x.date).toLocaleDateString()} · ${x.detail}</div></div><span class="badge">${x.type}</span></div>`).join(''):'<div class="panel"><div class="subtitle" style="text-align:center">Your saved readings will appear here.</div></div>'}</div></main>${nav('history')}`}
function profilePage(){let p=profile(),i=signFromDob(p.dob),z=signs[i];return `<main class="screen"><div class="top"><div></div><h1 class="title">Profile</h1><div></div></div><div class="profile-card" style="justify-content:center;text-align:center;display:block"><div class="avatar" style="margin:auto">${z[1]}</div><div class="title" style="font-size:20px;margin-top:8px">${p.name||'Seeker'}</div><div class="subtitle">${z[0]} · ${p.dob||'Add birth date'}</div></div><div class="premium-banner" onclick="go('premium')"><span>♛ ORACLY+</span><small>Premium Member ›</small></div><div class="list"><div class="row" onclick="go('history')"><div class="r-ico">▣</div><div class="r-main"><div class="r-title">My Readings</div></div><div class="chev">›</div></div><div class="row" onclick="go('birth')"><div class="r-ico">✦</div><div class="r-main"><div class="r-title">Birth Profile</div></div><div class="chev">›</div></div><div class="row"><div class="r-ico">♢</div><div class="r-main"><div class="r-title">Notifications</div></div><div class="chev">›</div></div><div class="row"><div class="r-ico">⚙</div><div class="r-main"><div class="r-title">Settings</div></div><div class="chev">›</div></div><div class="row"><div class="r-ico">?</div><div class="r-main"><div class="r-title">Help & Support</div></div><div class="chev">›</div></div></div></main>${nav('profile')}`}
function premium(){return `<main class="screen">${top('Unlock More with ORACLY+','profile')}<div class="moon" style="width:130px;height:130px;margin:24px auto 12px"></div><ul class="premium-list"><li>Unlimited Tarot Readings</li><li>3/5 Card Spread</li><li>Weekly & Monthly Horoscope</li><li>Detailed Compatibility</li><li>Premium Tarot Decks</li><li>Reading History</li><li>No Ads</li></ul><div class="price"><span>◉ Rp 19.000 / month</span><b class="gold">Monthly</b></div><div class="price"><span>◉ Rp 149.000 / year</span><b style="color:#c88cff">Save 34%</b></div><button class="btn btn-gold" onclick="alert('Premium checkout will be connected in the next release.')">Start Free Trial</button><div class="notice">Purchase flow is not enabled in this MVP build.</div></main>${nav('profile')}`}
function explore(){return tarot()}
function render(){let p=state.page;if(!localStorage.getItem('oracly_onboarded')&&p==='home')p='splash';let fn={splash,onboarding,home,daily,tarot,'tarot-pick':tarotPick,'tarot-result':tarotResult,horoscope,'horoscope-detail':horoscopeDetail,compatibility,birth,'birth-result':birthResult,history,profile:profilePage,premium,explore}[p]||home;app.innerHTML=fn()}
render();
</script>
</body>
</html>
