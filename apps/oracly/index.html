x;padding:16px}.goldline{border-color:#735a34}.home-head{display:flex;justify-content:space-between}.greet{font:500 26px/1.08 Georgia,serif}.greet small{display:block;font:12px Inter,system-ui;color:var(--muted);margin-top:9px}.crescent{font-size:50px;color:var(--gold2)}.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.menu-item{text-align:center;font-size:10px;color:#d8cedc}.menu-icon{height:54px;border:1px solid #342941;background:#171221;border-radius:14px;display:grid;place-items:center;font-size:22px;margin-bottom:6px}.section-title{font:500 19px Georgia,serif;margin:0 0 12px}.tarot-back{width:88px;height:134px;border:2px solid #b78f4b;border-radius:12px;background:repeating-radial-gradient(circle at 50% 50%,transparent 0 10px,#47315d 11px 12px),linear-gradient(145deg,#17102d,#090713);display:grid;place-items:center;color:var(--gold2);font-size:28px;box-shadow:0 15px 35px #0009}.daily-card{height:190px;display:grid;place-items:center}.energy-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.energy{text-align:center;font-size:10px;color:#c8becd}.energy b{display:grid;place-items:center;margin:0 auto 6px;width:38px;height:38px;border-radius:50%;background:#191328;border:1px solid #392b4f;font-size:18px}.bottomnav{position:fixed;z-index:20;bottom:0;width:100%;max-width:460px;display:grid;grid-template-columns:repeat(4,1fr);background:#090810f2;border-top:1px solid #241d31;padding:8px 8px calc(8px + var(--safe))}.navitem{border:0;background:transparent;color:#8d8499;font-size:10px;padding:4px}.navitem span{display:block;font-size:20px}.navitem.active{color:var(--gold2)}.tabs{display:flex;background:#171320;border:1px solid #2e263c;border-radius:16px;padding:3px;margin-bottom:14px}.tab{flex:1;border:0;background:transparent;color:#aaa1b3;padding:9px;border-radius:13px}.tab.active{background:linear-gradient(#f3d48c,#c99a45);color:#19100a;font-weight:800}.date{text-align:center;color:#aaa1b4;font-size:12px;margin:-4px 0 14px}.rating{text-align:center;font-size:24px;color:var(--gold2);letter-spacing:2px}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;gap:12px;border:1px solid #342b43;background:#15111e;border-radius:14px;padding:12px}.rico{flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:#221830;display:grid;place-items:center;font-size:22px}.rmain{flex:1}.rtitle{font:500 16px Georgia,serif}.rdesc{font-size:11px;color:#aaa0b3;margin-top:3px;line-height:1.35}.chev{color:var(--gold2);font-size:20px}.lucky{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #30263f;border-radius:14px;overflow:hidden;margin-top:12px}.lucky div{padding:11px 6px;text-align:center;font-size:10px;background:#110e18}.lucky strong{display:block;color:var(--gold2);font-size:15px;margin-top:4px}.three{display:flex;justify-content:center;gap:12px;margin:36px 0 28px}.pick{width:30%;max-width:118px;height:190px;transition:.2s}.pick .tarot-back{width:100%;height:100%}.pick.selected{transform:translateY(-15px);filter:drop-shadow(0 0 14px #d8b15e55)}.reading-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.face{border:1px solid #80643b;border-radius:10px;overflow:hidden;background:#151022}.face-art{height:124px;background:linear-gradient(160deg,#3c274f,#12101d 55%,#5e4625);display:grid;place-items:center;font-size:38px;color:#f5dc97}.face-name{font-size:10px;font-weight:800;text-align:center;padding:7px 3px;background:#e6c36e;color:#17100a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pos{text-align:center;color:#a99fb1;font-size:10px;margin-top:5px}.reading-text{font:14px/1.55 Georgia,serif;color:#ded4e1}.gold{color:var(--gold2)}.zodiac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 12px;margin-top:22px}.zodiac{text-align:center;color:#d8cedc;font-size:12px}.zsym{width:60px;height:60px;margin:0 auto 7px;border-radius:50%;border:1px solid #8f7042;display:grid;place-items:center;color:var(--gold2);font-size:29px;background:#100d17}.zodiac-hero{display:flex;align-items:center;gap:13px;margin-bottom:12px}.zodiac-hero .zsym{margin:0}.zn{font:500 24px Georgia,serif}.bars{display:flex;flex-direction:column;gap:12px;margin:18px 0}.barline{display:grid;grid-template-columns:92px 1fr 38px;gap:8px;align-items:center;font-size:12px}.bar{height:7px;border-radius:9px;background:#292033;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7a4ab8,#b66df0)}.compat-hero{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;text-align:center}.compat-x{font-size:28px;color:#c99f55}.score{text-align:center;font:40px Georgia,serif;color:var(--gold2);margin:16px 0}.score small{display:block;font:14px Inter,system-ui;color:#d8cfdc}.form{display:flex;flex-direction:column;gap:12px}.label{font-size:12px;color:#c7bccb}.input{width:100%;margin-top:6px;border:1px solid #30283d;background:#14101d;color:#f7f2f7;border-radius:10px;padding:12px}.profile-card{display:flex;gap:14px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;border:1px solid #8e7040;background:#181020;display:grid;place-items:center;font-size:35px}.traitgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.trait{border:1px solid #31283f;border-radius:12px;background:#14101d;padding:11px;font-size:11px;color:#a89fb1}.trait strong{display:block;color:#eee4ed;font-size:14px;margin-top:4px}.premium-banner{background:linear-gradient(90deg,#f0ca72,#d29c3e);color:#171008;border-radius:12px;padding:13px;display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:16px 0}.premium-list{list-style:none;padding:0}.premium-list li{padding:9px 0;border-bottom:1px solid #251c31}.premium-list li:before{content:'✓';color:var(--gold2);margin-right:10px}.notice{font-size:11px;color:#8f8699;text-align:center;line-height:1.5;margin-top:14px}

<body>

<script>
(function(){
'use strict';
var app=document.getElementById('app');
function q(s){return document.querySelector(s)}
var mem={};
function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:d}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
function json(k,d){try{return JSON.parse(get(k,''))||d}catch(e){return d}}
var signs=[['Aries','♈','21 Mar – 19 Apr','Fire'],['Taurus','♉','20 Apr – 20 May','Earth'],['Gemini','♊','21 May – 20 Jun','Air'],['Cancer','♋','21 Jun – 22 Jul','Water'],['Leo','♌','23 Jul – 22 Aug','Fire'],['Virgo','♍','23 Aug – 22 Sep','Earth'],['Libra','♎','23 Sep – 22 Oct','Air'],['Scorpio','♏','23 Oct – 21 Nov','Water'],['Sagittarius','♐','22 Nov – 21 Dec','Fire'],['Capricorn','♑','22 Dec – 19 Jan','Earth'],['Aquarius','♒','20 Jan – 18 Feb','Air'],['Pisces','♓','19 Feb – 20 Mar','Water']];
var major=[['The Fool','New beginnings, openness and a leap of faith.','Pause before acting on impulse.','✦'],['The Magician','Use your skills and resources with intention.','Scattered focus can weaken your progress.','✧'],['The High Priestess','Trust intuition and observe what is not being said.','Noise may be drowning out your inner voice.','☾'],['The Empress','Growth, comfort and creative abundance surround you.','Restore your energy before giving more.','❀'],['The Emperor','Structure and clear boundaries bring stability.','Avoid becoming rigid or controlling.','♜'],['The Hierophant','Wisdom comes through tradition, study or guidance.','Question rules that no longer fit you.','⌘'],['The Lovers','Alignment, meaningful choice and deep connection.','Mixed values need an honest conversation.','♥'],['The Chariot','Focused movement can overcome obstacles.','Slow down and regain direction.','➤'],['Strength','Quiet courage and patience are your advantage.','Do not force what needs gentleness.','♌'],['The Hermit','Step inward to find clarity before moving.','Isolation may be keeping you stuck.','✺'],['Wheel of Fortune','A cycle is turning; stay adaptable.','Resistance to change may create friction.','◎'],['Justice','Truth, balance and accountability matter now.','Check assumptions before judging.','⚖'],['The Hanged Man','A new perspective is more useful than pushing.','Delay without reflection becomes stagnation.','▽'],['Death','A necessary ending creates room for transformation.','Holding on may delay renewal.','✣'],['Temperance','Balance, moderation and integration lead forward.','Extremes are draining your momentum.','⚗'],['The Devil','Notice attachments, habits and tempting shortcuts.','You are ready to loosen an unhealthy pattern.','♑'],['The Tower','A sudden truth can clear unstable ground.','Avoid rebuilding the same weak foundation.','⚡'],['The Star','Hope, healing and renewed direction are available.','Reconnect with faith in your own path.','★'],['The Moon','Not everything is clear yet; move carefully.','Fear may be exaggerating uncertainty.','☽'],['The Sun','Confidence, warmth and visible progress grow.','Celebrate without ignoring practical details.','☀'],['Judgement','Reflection brings a chance to answer a higher call.','Release old self-criticism and decide.','♬'],['The World','Completion, integration and earned progress.','One final detail still needs closure.','⊙']];
var ranks=['Ace','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Page','Knight','Queen','King'];
var suits={Cups:['emotion, relationships and intuition','♡'],Pentacles:['money, stability and practical matters','◈'],Swords:['thoughts, truth and decisions','†'],Wands:['energy, ambition and creative action','✦']};
var deck=[];major.forEach(function(x,i){deck.push({id:'M'+i,name:x[0],up:x[1],rev:x[2],sym:x[3]})});Object.keys(suits).forEach(function(s){ranks.forEach(function(r,i){deck.push({id:s.charAt(0)+i,name:r+' of '+s,up:r+' energy highlights '+suits[s][0]+'. Focus on what can grow through steady awareness.',rev:'The '+r.toLowerCase()+' energy in '+suits[s][0]+' may feel blocked or delayed. Reassess before pushing.',sym:suits[s][1]})})});
var state={page:'home',mode:'three',draw:[],zodiac:4,a:4,b:7};
function profile(){return json('oracly_profile',{name:'Arda',dob:'1998-04-12',time:'14:30',gender:'Male'})}
function history(){return json('oracly_history',[])}
function addHistory(title,detail){var h=history();h.unshift({title:title,detail:detail,date:new Date().toISOString()});set('oracly_history',JSON.stringify(h.slice(0,50)))}
function seed(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return Math.abs(h)}
function today(){return new Date().toISOString().slice(0,10)}
function nav(active){var a=[['home','⌂','Home'],['explore','⌕','Explore'],['history','▣','History'],['profile','●','Profile']];return '<nav class="bottomnav">'+a.map(function(n){return '<button class="navitem '+(active===n[0]?'active':'')+'" data-go="'+n[0]+'"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join('')+'</nav>'}
function top(t,b){return '<div class="top"><button class="back" data-go="'+b+'">‹</button><h1 class="title">'+t+'</h1><div style="width:38px"></div></div>'}
function snippet(k){var o={love:['A conversation you have been avoiding may finally bring clarity.','Protect your peace without closing your heart.','A small sign of affection may matter more than a dramatic gesture.'],career:['Focus on finishing one important task before starting something new.','Your consistency is more valuable than speed today.','A useful opportunity may appear through a simple conversation.'],money:['Be cautious with impulsive spending today.','Review small recurring expenses before making a larger purchase.','Keep money decisions simple and avoid pressure.'],energy:['A day of progress and inner clarity. Trust the process.','Move steadily; your energy improves when your priorities are clear.','A quieter pace can reveal what actually matters.']};var arr=o[k];return arr[seed(today()+k)%arr.length]}
function splash(){return '<main class="screen no-nav"><div class="moon">☾</div><div class="brand">ORACLY</div><div class="brand-sub">TAROT, ZODIAC & DAILY GUIDANCE</div><div class="hero-copy"><h2>More Clarity<br>A Brighter You</h2><p>Daily guidance designed for reflection, intuition and mindful choices.</p></div><button class="btn goldbtn" data-action="start">Get Started</button><div class="notice">For entertainment and personal reflection.</div></main>'}
function onboarding(){return '<main class="screen no-nav">'+top('Find Guidance Every Day','home')+'<div class="moon" style="margin-top:35px">✦</div><div class="hero-copy"><h2>Tarot, Horoscope & Daily Insights</h2><p>One calm space for daily reflection.</p></div><button class="btn goldbtn" data-go="home">Continue</button></main>'}
function home(){var p=profile();return '<main class="screen"><div class="home-head"><div class="greet">Good Evening,<br>'+esc(p.name||'Seeker')+'<small>Your energy for today is waiting.</small></div><div class="crescent">☾</div></div><div class="menu-grid"><div class="menu-item" data-go="daily"><div class="menu-icon">✧</div>Daily Reading</div><div class="menu-item" data-go="tarot"><div class="menu-icon">▣</div>Tarot</div><div class="menu-item" data-go="horoscope"><div class="menu-icon">☀</div>Horoscope</div><div class="menu-item" data-go="compatibility"><div class="menu-icon">♡</div>Compatibility</div></div><section class="panel goldline"><h3 class="section-title" style="text-align:center">Your Card Today</h3><div class="daily-card"><div class="tarot-back">✦</div></div><button class="btn goldbtn" data-action="daily-card">Reveal Card</button></section><h3 class="section-title" style="margin-top:18px">Today\'s Energy</h3><div class="energy-row"><div class="energy"><b>♥</b>Love</div><div class="energy"><b>▣</b>Career</div><div class="energy"><b>◉</b>Money</div><div class="energy"><b>☾</b>Mood</div></div></main>'+nav('home')}
function daily(){var n=4+(seed(today())%2);return '<main class="screen">'+top('Daily Reading','home')+'<div class="tabs"><button class="tab active">Today</button><button class="tab">Week</button><button class="tab">Month</button></div><div class="date">'+new Date().toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'})+'</div><section class="panel"><div style="text-align:center;color:var(--gold2);font-family:Georgia,serif">Today\'s Energy</div><div class="rating">'+('★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n))+'</div><p class="subtitle" style="text-align:center;color:#ddd3e1">'+snippet('energy')+'</p></section><div style="height:12px"></div><div class="list">'+row('♥','Love',snippet('love'))+row('▣','Career',snippet('career'))+row('◉','Money',snippet('money'))+'</div><div class="lucky"><div>Lucky Number<strong>'+((seed(today()+'n')%9)+1)+'</strong></div><div>Lucky Color<strong>'+['Gold','Violet','Silver','Blue'][seed(today()+'c')%4]+'</strong></div><div>Best Time<strong>'+['09:00','14:00','19:00','21:00'][seed(today()+'t')%4]+'</strong></div></div></main>'+nav('explore')}
function row(i,t,d,go){return '<div class="row" '+(go?'data-go="'+go+'"':'')+'><div class="rico">'+i+'</div><div class="rmain"><div class="rtitle">'+t+'</div><div class="rdesc">'+d+'</div></div>'+(go?'<div class="chev">›</div>':'')+'</div>'}
function tarot(){return '<main class="screen">'+top('Tarot','home')+'<div class="subtitle" style="text-align:center;margin:-8px 0 18px">Choose Your Reading</div><div class="list">'+row('☀','Card of The Day','A simple guidance for today.','daily-card')+row('♥','Love Reading','Insights about your love life.','tarot-love')+row('▣','Career Reading','Guidance for your career.','tarot-career')+row('◉','Money Reading','See your financial energy.','tarot-money')+row('☾','Yes / No','Get a reflective answer.','tarot-yesno')+row('▱','3 Card Reading','Past · Present · Future','tarot-three')+'</div></main>'+nav('explore')}
function tarotPick(){var need=state.mode==='three'?3:1;return '<main class="screen">'+top(need===3?'Three Card Reading':'Choose a Card','tarot')+'<div class="subtitle" style="text-align:center">Focus on your question, then choose '+(need===3?'three':'one')+' card'+(need===3?'s':'')+'.</div><div class="three">'+[0,1,2].map(function(i){return '<div class="pick '+(state.draw[i]?'selected':'')+'" data-pick="'+i+'"><div class="tarot-back">✦</div></div>'}).join('')+'</div><button class="btn goldbtn" data-action="shuffle">Shuffle Cards</button><div class="panel" style="margin-top:16px"><div class="subtitle">Take a moment, focus on your question, then choose naturally.</div></div></main>'+nav('explore')}
function randomCard(){var used=state.draw.filter(Boolean).map(function(c){return c.id});var c;do{c=deck[Math.floor(Math.random()*deck.length)]}while(used.indexOf(c.id)>=0);return {id:c.id,name:c.name,up:c.up,revText:c.rev,sym:c.sym,reversed:Math.random()<.28}}
function tarotResult(){var cards=state.draw.filter(Boolean);if(!cards.length)cards=[dailyCard()];var labels=cards.length===3?['Past','Present','Future']:['Your Card'];var yes=state.mode==='yesno'?((seed(cards[0].name+today())%2)?'YES — move forward thoughtfully.':'NO / NOT YET — give the situation more space.'):'Your cards suggest a theme to reflect on rather than a fixed prediction.';return '<main class="screen">'+top('Your Reading','tarot')+'<div class="reading-cards">'+cards.map(function(c,i){return '<div><div class="face"><div class="face-art">'+c.sym+'</div><div class="face-name">'+c.name+'</div></div><div class="pos">'+labels[i]+(c.reversed?' · Reversed':'')+'</div></div>'}).join('')+'</div><section class="panel"><div class="reading-text"><strong class="gold">'+yes+'</strong><br><br>'+cards.map(function(c){return '<b>'+c.name+(c.reversed?' (Reversed)':'')+'</b>: '+(c.reversed?c.revText:c.up)}).join('<br><br>')+'</div></section><div style="height:12px"></div><button class="btn goldbtn" data-go="tarot">New Reading</button></main>'+nav('history')}
function dailyCard(){var c=deck[seed(today())%deck.length];return {id:c.id,name:c.name,up:c.up,revText:c.rev,sym:c.sym,reversed:(seed(today()+'rev')%4===0)}}
function horoscope(){return '<main class="screen">'+top('Horoscope','home')+'<div class="zodiac-grid">'+signs.map(function(z,i){return '<div class="zodiac" data-z="'+i+'"><div class="zsym">'+z[1]+'</div>'+z[0]+'</div>'}).join('')+'</div></main>'+nav('explore')}
function horoscopeDetail(){var z=signs[state.zodiac],base=seed(today()+z[0]);var overall=['A powerful day to take action and express your true self.','Stay observant; small adjustments can create a smoother day.','Your best results come from patience and selective focus.','Momentum grows when your actions match your values.'][base%4];return '<main class="screen">'+top('', 'horoscope')+'<div class="zodiac-hero"><div class="zsym">'+z[1]+'</div><div><div class="zn">'+z[0]+'</div><div class="subtitle">'+z[2]+'</div></div></div><div class="tabs"><button class="tab active">Today</button><button class="tab">Week</button><button class="tab">Month</button></div><div class="list">'+row('☆','Overall',overall)+row('♥','Love',snippet('love'))+row('▣','Career',snippet('career'))+row('◉','Finance',snippet('money'))+row('☾','Energy','Choose a sustainable pace and make room for rest.')+'</div><div class="lucky"><div>Lucky Number<strong>'+((base%9)+1)+'</strong></div><div>Lucky Color<strong>'+['Gold','Violet','Silver','Blue'][base%4]+'</strong></div><div>Match<strong>'+signs[(base+3)%12][0]+'</strong></div></div></main>'+nav('explore')}
function compatibility(){var a=signs[state.a],b=signs[state.b],s=55+(seed(a[0]+b[0])%41),vals=[Math.min(98,s+4),Math.max(45,s-4),Math.min(97,s+2),Math.max(48,s-2)];return '<main class="screen">'+top('Compatibility','home')+'<div class="compat-hero"><div><div class="zsym">'+a[1]+'</div>'+selectSigns('a',state.a)+'</div><div class="compat-x">×</div><div><div class="zsym">'+b[1]+'</div>'+selectSigns('b',state.b)+'</div></div><div class="score">'+s+'%<small>Match</small></div><div class="bars">'+['Chemistry','Communication','Trust','Long-term'].map(function(x,i){return '<div class="barline"><span>'+x+'</span><div class="bar"><i style="width:'+vals[i]+'%"></i></div><b>'+vals[i]+'%</b></div>'}).join('')+'</div><section class="panel"><div class="reading-text">'+a[0]+' and '+b[0]+' can build a meaningful connection when both people respect differences in pace, communication and emotional needs.</div></section></main>'+nav('explore')}
function selectSigns(k,v){return '<select class="input" data-select="'+k+'">'+signs.map(function(z,i){return '<option value="'+i+'" '+(i===v?'selected':'')+'>'+z[0]+'</option>'}).join('')+'</select>'}
function signFromDob(d){if(!d)return 4;var dt=new Date(d+'T12:00:00'),m=dt.getMonth()+1,day=dt.getDate(),cuts=[[1,20,9,10],[2,19,10,11],[3,21,11,0],[4,20,0,1],[5,21,1,2],[6,21,2,3],[7,23,3,4],[8,23,4,5],[9,23,5,6],[10,23,6,7],[11,22,7,8],[12,22,8,9]],r=cuts[m-1];return day<r[1]?r[2]:r[3]}
function birth(){var p=profile();return '<main class="screen">'+top('Birth Profile','profile')+'<div class="form"><label class="label">Name<input id="pname" class="input" value="'+esc(p.name||'')+'"></label><label class="label">Date of Birth<input id="pdob" type="date" class="input" value="'+esc(p.dob||'')+'"></label><label class="label">Time of Birth (Optional)<input id="ptime" type="time" class="input" value="'+esc(p.time||'')+'"></label><label class="label">Gender (Optional)<select id="pgender" class="input"><option>Male</option><option>Female</option><option>Prefer not to say</option></select></label></div><div style="height:12px"></div><button class="btn goldbtn" data-action="save-profile">Generate My Profile</button></main>'+nav('profile')}
function birthResult(){var p=profile(),i=signFromDob(p.dob),z=signs[i],planets={Aries:'Mars',Taurus:'Venus',Gemini:'Mercury',Cancer:'Moon',Leo:'Sun',Virgo:'Mercury',Libra:'Venus',Scorpio:'Pluto',Sagittarius:'Jupiter',Capricorn:'Saturn',Aquarius:'Uranus',Pisces:'Neptune'},traits={Fire:'Confident · Active · Expressive',Earth:'Grounded · Loyal · Practical',Air:'Curious · Social · Analytical',Water:'Intuitive · Sensitive · Deep'};return '<main class="screen">'+top('Your Profile','profile')+'<div class="profile-card"><div class="avatar">'+z[1]+'</div><div><div class="subtitle">Sun Sign</div><div class="title">'+z[0]+'</div></div></div><div class="traitgrid"><div class="trait">Element<strong>'+z[3]+'</strong></div><div class="trait">Ruling Planet<strong>'+planets[z[0]]+'</strong></div></div><div class="panel">'+traits[z[3]]+'</div><div style="height:12px"></div><button class="btn goldbtn" data-go="profile">Save to Profile</button></main>'+nav('profile')}
function historyPage(){var h=history();return '<main class="screen">'+top('My Readings','home')+'<div class="tabs"><button class="tab active">All</button><button class="tab">Tarot</button><button class="tab">Horoscope</button><button class="tab">Daily</button></div><div class="list">'+(h.length?h.map(function(x){return row('▱',x.title,new Date(x.date).toLocaleDateString()+' · '+x.detail)}).join(''):'<div class="panel"><div class="subtitle" style="text-align:center">Your saved readings will appear here.</div></div>')+'</div></main>'+nav('history')}
function profilePage(){var p=profile(),z=signs[signFromDob(p.dob)];return '<main class="screen"><div class="top"><div></div><h1 class="title">Profile</h1><div></div></div><div class="profile-card" style="display:block;text-align:center"><div class="avatar" style="margin:auto">'+z[1]+'</div><div class="title" style="font-size:20px;margin-top:8px">'+esc(p.name||'Seeker')+'</div><div class="subtitle">'+z[0]+' · '+esc(p.dob||'Add birth date')+'</div></div><div class="premium-banner" data-go="premium"><span>♛ ORACLY+</span><small>Premium ›</small></div><div class="list">'+row('▣','My Readings','Saved tarot readings','history')+row('✦','Birth Profile','Your zodiac profile','birth')+row('♢','Notifications','Coming soon')+row('⚙','Settings','Coming soon')+'</div></main>'+nav('profile')}
function premium(){return '<main class="screen">'+top('Unlock More with ORACLY+','profile')+'<div class="moon" style="width:130px;height:130px;margin:24px auto 12px;font-size:80px">☾</div><ul class="premium-list"><li>Unlimited Tarot Readings</li><li>3/5 Card Spread</li><li>Weekly & Monthly Horoscope</li><li>Detailed Compatibility</li><li>Premium Tarot Decks</li><li>Reading History</li><li>No Ads</li></ul><div class="panel">Rp 19.000 / month<br><br>Rp 149.000 / year</div><div style="height:12px"></div><button class="btn goldbtn" data-action="premium">Start Free Trial</button><div class="notice">Purchase flow is not enabled in this MVP build.</div></main>'+nav('profile')}
function esc(s){return String(s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
function go(p){state.page=p;render();try{window.scrollTo(0,0)}catch(e){}}
function render(){var p=state.page;if(!get('oracly_onboarded','')&&p==='home')p='splash';var pages={splash:splash,onboarding:onboarding,home:home,daily:daily,tarot:tarot,'tarot-pick':tarotPick,'tarot-result':tarotResult,horoscope:horoscope,'horoscope-detail':horoscopeDetail,compatibility:compatibility,birth:birth,'birth-result':birthResult,history:historyPage,profile:profilePage,premium:premium,explore:tarot};app.innerHTML='<div class="stars"></div>'+pages[p]();bind()}
function bind(){app.querySelectorAll('[data-go]').forEach(function(el){el.onclick=function(){var g=el.getAttribute('data-go');if(g==='daily-card'){showDailyCard()}else if(g.indexOf('tarot-')===0){state.mode=g.slice(6);state.draw=[];go('tarot-pick')}else{go(g)}}});app.querySelectorAll('[data-pick]').forEach(function(el){el.onclick=function(){var i=parseInt(el.getAttribute('data-pick'),10);if(state.draw[i])return;state.draw[i]=randomCard();render();var need=state.mode==='three'?3:1;if(state.draw.filter(Boolean).length>=need){setTimeout(function(){var cards=state.draw.filter(Boolean);addHistory(state.mode==='three'?'Three Card Reading':state.mode+' Reading',cards.map(function(c){return c.name+(c.reversed?' (R)':'')}).join(' · '));go('tarot-result')},180)}}});app.querySelectorAll('[data-z]').forEach(function(el){el.onclick=function(){state.zodiac=parseInt(el.getAttribute('data-z'),10);go('horoscope-detail')}});app.querySelectorAll('[data-select]').forEach(function(el){el.onchange=function(){state[el.getAttribute('data-select')]=parseInt(el.value,10);render()}});var start=app.querySelector('[data-action="start"]');if(start)start.onclick=function(){set('oracly_onboarded','1');go('onboarding')};var dailyBtn=app.querySelector('[data-action="daily-card"]');if(dailyBtn)dailyBtn.onclick=showDailyCard;var sh=app.querySelector('[data-action="shuffle"]');if(sh)sh.onclick=function(){state.draw=[];render()};var sp=app.querySelector('[data-action="save-profile"]');if(sp)sp.onclick=function(){var p={name:q('#pname').value.trim()||'Seeker',dob:q('#pdob').value,time:q('#ptime').value,gender:q('#pgender').value};set('oracly_profile',JSON.stringify(p));state.zodiac=signFromDob(p.dob);go('birth-result')};var prem=app.querySelector('[data-action="premium"]');if(prem)prem.onclick=function(){alert('Premium checkout will be connected in a later release.')}}
function showDailyCard(){var c=dailyCard();state.mode='daily';state.draw=[c];addHistory('Card of the Day',c.name+(c.reversed?' (R)':''));go('tarot-result')}
var fallback=document.getElementById('bootButton');if(fallback)fallback.onclick=function(){set('oracly_onboarded','1');state.page='onboarding';render()};
try{render()}catch(err){var f=document.getElementById('bootFallback');if(f){f.insertAdjacentHTML('beforeend','<div class="notice">ORACLY encountered a startup error. Please reinstall the latest build.</div>')}}
})();
</script>
</body>
