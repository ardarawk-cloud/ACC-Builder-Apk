plugins { id 'com.android.application' }
android {
  namespace 'id.nadmo.live'
  compileSdk 35
  defaultConfig {
    applicationId 'id.nadmo.live'
    minSdk 26
    targetSdk 35
    versionCode 8
    versionName '0.8.0-beta'
  }
  signingConfigs {
    release {
      def store = System.getenv('NADMO_LIVE_RELEASE_STORE_FILE')
      def storePass = System.getenv('NADMO_LIVE_RELEASE_STORE_PASSWORD')
      def alias = System.getenv('NADMO_LIVE_RELEASE_KEY_ALIAS')
      def keyPass = System.getenv('NADMO_LIVE_RELEASE_KEY_PASSWORD')
      if (store && storePass && alias && keyPass) {
        storeFile file(store)
        storePassword storePass
        keyAlias alias
        keyPassword keyPass
      }
    }
  }
  buildTypes {
    release {
      // Never publish a release APK without persistent, privately stored signing credentials.
      signingConfig signingConfigs.release
      minifyEnabled false
      shrinkResources false
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'androidx.webkit:webkit:1.12.1'
}
