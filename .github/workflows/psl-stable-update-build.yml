name: PSL Legacy Build Frozen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    runs-on: ubuntu-latest
    steps:
      - name: Stop legacy release path
        shell: bash
        run: |
          echo "Legacy package com.accbuilder.papasaucelab is frozen."
          echo "Reason: its original release certificate is not available in the current build cache."
          echo "Use only the canonical V2 release path defined in apps/papa-sauce-lab/release-lock.json."
          exit 1
