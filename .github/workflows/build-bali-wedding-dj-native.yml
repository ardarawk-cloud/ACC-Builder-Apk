name: Build Bali Wedding DJ Native APK

on:
  push:
    branches:
      - feat/bali-wedding-dj-native-v1
      - feat/bali-wedding-dj-cloud-v2
    paths:
      - "native/bali-wedding-dj-src/**"
      - "scripts/patch_bwd_business_contact.py"
      - "scripts/patch_bwd_cloud_v2.py"
      - "scripts/patch_bwd_receipt_cloud.py"
      - "scripts/patch_bwd_public_client.py"
      - ".github/workflows/build-bali-wedding-dj-native.yml"
      - "bali-wedding-dj-native.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore native project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            native/bali-wedding-dj-src/part00.b64 \
            native/bali-wedding-dj-src/part01-0.b64 \
            native/bali-wedding-dj-src/part01-1.b64 \
            native/bali-wedding-dj-src/part01-2.b64 \
            native/bali-wedding-dj-src/part01-3.b64 \
            native/bali-wedding-dj-src/part01-4.b64 \
            native/bali-wedding-dj-src/part01-5.b64 \
            native/bali-wedding-dj-src/part02.b64 \
            native/bali-wedding-dj-src/part03.b64 \
            native/bali-wedding-dj-src/part04.b64 > /tmp/bwd.b64
          test "$(wc -c < /tmp/bwd.b64)" = "27968"
          base64 -d /tmp/bwd.b64 > /tmp/bwd.tar.gz
          echo "86cba805905897f5c48350be8bfa36a1b6164ba2f455ed93a0c0865c31905650  /tmp/bwd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bwd.tar.gz
          test -f bwd-native/app/src/main/java/com/baliweddingdj/app/MainActivity.java
          test -f bwd-native/app/src/main/java/com/baliweddingdj/app/WeddingDb.java
          if grep -R "WebView" -n bwd-native/app/src/main/java; then
            echo "WebView usage is forbidden for this native build."
            exit 1
          fi

      - name: Upload restored source for inspection
        if: github.ref_name == 'feat/bali-wedding-dj-cloud-v2'
        uses: actions/upload-artifact@v4
        with:
          name: bwd-native-restored-source
          path: bwd-native
          retention-days: 2

      - name: Apply business WhatsApp contact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_bwd_business_contact.py bwd-native
          grep -R '6282247972288\|+62 822-4797-2288' -n bwd-native/app/src/main/java/com/baliweddingdj/app

      - name: Apply Cloud V2 patch
        if: github.ref_name == 'feat/bali-wedding-dj-cloud-v2' && hashFiles('scripts/patch_bwd_cloud_v2.py') != ''
        shell: bash
        env:
          BWD_FIREBASE_API_KEY: ${{ secrets.BWD_FIREBASE_API_KEY }}
          BWD_FIREBASE_APP_ID: ${{ secrets.BWD_FIREBASE_APP_ID }}
          BWD_FIREBASE_PROJECT_ID: ${{ secrets.BWD_FIREBASE_PROJECT_ID }}
          BWD_FIREBASE_SENDER_ID: ${{ secrets.BWD_FIREBASE_SENDER_ID }}
          BWD_CLOUD_BASE_URL: ${{ secrets.BWD_CLOUD_BASE_URL }}
        run: |
          set -euo pipefail
          python3 scripts/patch_bwd_cloud_v2.py bwd-native
          touch bwd-native/gradle.properties
          if grep -q '^android.useAndroidX=' bwd-native/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' bwd-native/gradle.properties
          else
            echo 'android.useAndroidX=true' >> bwd-native/gradle.properties
          fi
          if grep -q '^android.suppressUnsupportedCompileSdk=' bwd-native/gradle.properties; then
            sed -i 's/^android.suppressUnsupportedCompileSdk=.*/android.suppressUnsupportedCompileSdk=36/' bwd-native/gradle.properties
          else
            echo 'android.suppressUnsupportedCompileSdk=36' >> bwd-native/gradle.properties
          fi

      - name: Apply secure receipt cloud patch
        if: github.ref_name == 'feat/bali-wedding-dj-cloud-v2'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_bwd_receipt_cloud.py bwd-native
          grep -q 'submitReceipt' bwd-native/app/src/main/java/com/baliweddingdj/app/BwdCloud.java
          grep -q 'receipt_url' bwd-native/app/src/main/java/com/baliweddingdj/app/BwdFirebaseMessagingService.java

      - name: Apply customer safety patch
        if: github.ref_name == 'feat/bali-wedding-dj-cloud-v2'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_bwd_public_client.py bwd-native
          ! grep -q 'ADMIN ACCESS' bwd-native/app/src/main/java/com/baliweddingdj/app/MainActivity.java

      - name: Apply UI wording update
        shell: bash
        run: |
          set -euo pipefail
          find bwd-native/app/src/main/java -name '*.java' -print0 | xargs -0 sed -i 's/"Reception"/"Wedding Reception"/g'
          grep -R 'Wedding Reception' -n bwd-native/app/src/main/java

      - name: Build native APK
        shell: bash
        run: |
          set -euo pipefail
          cd bwd-native
          gradle --no-daemon :app:assembleDebug --stacktrace
          mkdir -p ../dist
          if [ "${GITHUB_REF_NAME}" = "feat/bali-wedding-dj-cloud-v2" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/BALI-WEDDING-DJ-Cloud-v2-client-safe-debug.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../dist/BALI-WEDDING-DJ-Native-v1.1.apk
          fi

      - name: APK checksum
        shell: bash
        run: sha256sum dist/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BALI-WEDDING-DJ-${{ github.ref_name == 'feat/bali-wedding-dj-cloud-v2' && 'Cloud-v2-client-safe-debug' || 'Native-v1.1' }}
          path: dist/*.apk
          retention-days: 30
