name: BWD v1 Master RC Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bwd-v1-master-batch
    paths:
      - "bwd-master-final.trigger"

permissions:
  contents: read

jobs:
  master-rc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore canonical native project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            native/bali-wedding-dj-src/part00.b64 \
            native/bali-wedding-dj-src/part01-0.b64 \
            native/bali-wedding-dj-src/part01-1.b64 \
            native/bali-wedding-dj-src/part01-2.b64 \
            native/bali-wedding-dj-src/part01-3.b64 \
            native/bali-wedding-dj-src/part01-4.b64 \
            native/bali-wedding-dj-src/part01-5.b64 \
            native/bali-wedding-dj-src/part02.b64 \
            native/bali-wedding-dj-src/part03.b64 \
            native/bali-wedding-dj-src/part04.b64 > /tmp/bwd.b64
          test "$(wc -c < /tmp/bwd.b64)" = "27968"
          base64 -d /tmp/bwd.b64 > /tmp/bwd.tar.gz
          echo "86cba805905897f5c48350be8bfa36a1b6164ba2f455ed93a0c0865c31905650  /tmp/bwd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bwd.tar.gz
          test -f bwd-native/app/src/main/java/com/baliweddingdj/app/MainActivity.java
          test -f bwd-native/app/src/main/java/com/baliweddingdj/app/WeddingDb.java

      - name: Apply business contact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_bwd_business_contact.py bwd-native
          ! grep -R '628113813737\|+62 811-3813-737' -n bwd-native/app/src/main/java
          grep -R '6282247972288\|+62 822-4797-2288' -n bwd-native/app/src/main/java/com/baliweddingdj/app

      - name: Apply BWD v1 master patch
        shell: bash
        env:
          BWD_FIREBASE_API_KEY: ${{ secrets.BWD_FIREBASE_API_KEY }}
          BWD_FIREBASE_APP_ID: ${{ secrets.BWD_FIREBASE_APP_ID }}
          BWD_FIREBASE_OWNER_APP_ID: ${{ secrets.BWD_FIREBASE_OWNER_APP_ID }}
          BWD_FIREBASE_PROJECT_ID: ${{ secrets.BWD_FIREBASE_PROJECT_ID }}
          BWD_FIREBASE_SENDER_ID: ${{ secrets.BWD_FIREBASE_SENDER_ID }}
          BWD_CLOUD_BASE_URL: ${{ secrets.BWD_CLOUD_BASE_URL }}
        run: |
          set -euo pipefail
          python3 scripts/patch_bwd_master_v1.py bwd-native
          python3 scripts/patch_bwd_release_fixups.py bwd-native
          cat > bwd-native/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=36
          EOF
          grep -q 'syncClientBookings' bwd-native/app/src/main/java/com/baliweddingdj/app/BwdCloud.java
          grep -q 'syncOwner' bwd-native/app/src/main/java/com/baliweddingdj/app/BwdCloud.java
          grep -q 'viewAdminReceipt' bwd-native/app/src/main/java/com/baliweddingdj/app/BwdCloud.java
          grep -q 'applyCloudBooking' bwd-native/app/src/main/java/com/baliweddingdj/app/WeddingDb.java
          grep -q 'String openId=' bwd-native/app/src/main/java/com/baliweddingdj/app/MainActivity.java
          grep -q 'cloudAccepted' bwd-native/app/src/main/java/com/baliweddingdj/app/WeddingDb.java

      - name: Snapshot dedicated Owner app
        shell: bash
        run: |
          set -euo pipefail
          cp -a bwd-native bwd-owner
          sed -i "s/applicationId 'com.baliweddingdj.app'/applicationId 'com.baliweddingdj.owner'/" bwd-owner/app/build.gradle
          sed -i 's/android:label="Bali Wedding DJ"/android:label="Bali Wedding DJ Owner"/' bwd-owner/app/src/main/AndroidManifest.xml
          grep -q "applicationId 'com.baliweddingdj.owner'" bwd-owner/app/build.gradle
          grep -q 'DASHBOARD' bwd-owner/app/src/main/java/com/baliweddingdj/app/MainActivity.java
          grep -q 'showAdminPayments' bwd-owner/app/src/main/java/com/baliweddingdj/app/MainActivity.java

      - name: Lock public Client app
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_bwd_public_client.py bwd-native
          ! grep -q 'ADMIN ACCESS' bwd-native/app/src/main/java/com/baliweddingdj/app/MainActivity.java
          ! grep -q 'p.addView(Ui.section(this,"ADMIN"))' bwd-native/app/src/main/java/com/baliweddingdj/app/MainActivity.java
          grep -q 'MY BOOKING' bwd-native/app/src/main/java/com/baliweddingdj/app/MainActivity.java

      - name: Apply final wording
        shell: bash
        run: |
          set -euo pipefail
          find bwd-native/app/src/main/java -name '*.java' -print0 | xargs -0 sed -i 's/"Reception"/"Wedding Reception"/g'
          find bwd-owner/app/src/main/java -name '*.java' -print0 | xargs -0 sed -i 's/"Reception"/"Wedding Reception"/g'

      - name: Backend QC in same run
        shell: bash
        run: |
          set -euo pipefail
          cd backend/bwd-cloud-v2/functions
          npm install --ignore-scripts
          node --check index.js
          npm ls --depth=0

      - name: Build Client and Owner APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd bwd-native && gradle --no-daemon :app:assembleDebug --stacktrace)
          cp bwd-native/app/build/outputs/apk/debug/app-debug.apk dist/BALI-WEDDING-DJ-v1-CLIENT-RC.apk
          (cd bwd-owner && gradle --no-daemon :app:assembleDebug --stacktrace)
          cp bwd-owner/app/build/outputs/apk/debug/app-debug.apk dist/BALI-WEDDING-DJ-v1-OWNER-RC.apk

      - name: Verify APK identities
        shell: bash
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          "$AAPT" dump badging dist/BALI-WEDDING-DJ-v1-CLIENT-RC.apk | tee /tmp/client.badging
          "$AAPT" dump badging dist/BALI-WEDDING-DJ-v1-OWNER-RC.apk | tee /tmp/owner.badging
          grep -q "package: name='com.baliweddingdj.app'" /tmp/client.badging
          grep -q "package: name='com.baliweddingdj.owner'" /tmp/owner.badging
          grep -q "application-label:'Bali Wedding DJ Owner'" /tmp/owner.badging

      - name: Cloud configuration status
        shell: bash
        env:
          BWD_FIREBASE_API_KEY: ${{ secrets.BWD_FIREBASE_API_KEY }}
          BWD_FIREBASE_APP_ID: ${{ secrets.BWD_FIREBASE_APP_ID }}
          BWD_FIREBASE_OWNER_APP_ID: ${{ secrets.BWD_FIREBASE_OWNER_APP_ID }}
          BWD_FIREBASE_PROJECT_ID: ${{ secrets.BWD_FIREBASE_PROJECT_ID }}
          BWD_FIREBASE_SENDER_ID: ${{ secrets.BWD_FIREBASE_SENDER_ID }}
          BWD_CLOUD_BASE_URL: ${{ secrets.BWD_CLOUD_BASE_URL }}
        run: |
          set -euo pipefail
          missing=0
          : > dist/CLOUD-CONFIG-STATUS.txt
          for key in BWD_FIREBASE_API_KEY BWD_FIREBASE_APP_ID BWD_FIREBASE_OWNER_APP_ID BWD_FIREBASE_PROJECT_ID BWD_FIREBASE_SENDER_ID BWD_CLOUD_BASE_URL; do
            if [ -z "${!key:-}" ]; then
              echo "$key=MISSING" >> dist/CLOUD-CONFIG-STATUS.txt
              missing=1
            else
              echo "$key=SET" >> dist/CLOUD-CONFIG-STATUS.txt
            fi
          done
          if [ "$missing" = 0 ]; then echo 'RUNTIME_GATE=CLOUD_CONFIGURED' >> dist/CLOUD-CONFIG-STATUS.txt; else echo 'RUNTIME_GATE=RC_LOCAL_FALLBACK_ONLY' >> dist/CLOUD-CONFIG-STATUS.txt; fi
          cat dist/CLOUD-CONFIG-STATUS.txt

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload single RC artifact
        uses: actions/upload-artifact@v4
        with:
          name: BALI-WEDDING-DJ-v1-MASTER-RC
          path: dist/*
          retention-days: 30
