name: After School City V0.8.2 Public Rescue QC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-v082-public-rescue-qc.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: after-school-city-v082-public-rescue-qc
  cancel-in-progress: false

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 398f80859527a09d65eae59474342895fef31949
      BASE_LIVE_SHA: efa281ac26f847f683e002b6085b49d196c05421
      EXPECTED_VERSION: 0.8.2-road-sidewalk-intersection-cleanup-1
    steps:
      - name: Checkout QC repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact public After School City source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 398f80859527a09d65eae59474342895fef31949
          path: asc-source
          fetch-depth: 0

      - name: Verify exact source and V0.8.2 delta
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 10; }
          git -C asc-source cat-file -e "${BASE_LIVE_SHA}^{commit}"
          mapfile -t files < <(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA")
          printf '%s\n' "${files[@]}"
          [[ ${#files[@]} -eq 3 ]] || { echo "Unexpected V0.8.2 delta count: ${#files[@]}"; exit 11; }
          expected=(
            'maps/after-school-city/after-school-city.config.lua'
            'maps/after-school-city/after-school-city.road-sidewalk-intersection-cleanup.server.lua'
            'maps/after-school-city/default.project.json'
          )
          for f in "${expected[@]}"; do
            printf '%s\n' "${files[@]}" | grep -Fxq "$f" || { echo "Expected delta missing: $f"; exit 12; }
          done
          echo "SOURCE LOCK PASS source=$actual base=$BASE_LIVE_SHA delta=3-files"

      - name: Audit V0.8.2 asphalt intersection contract
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          $map='maps/after-school-city'
          $fix=Get-Content "$map/after-school-city.road-sidewalk-intersection-cleanup.server.lua" -Raw
          $world=Get-Content "$map/after-school-city.world.server.lua" -Raw
          $street=Get-Content "$map/after-school-city.street-life.server.lua" -Raw
          $v081=Get-Content "$map/after-school-city.road-concrete-strip-cleanup.server.lua" -Raw
          $config=Get-Content "$map/after-school-city.config.lua" -Raw
          $project=Get-Content "$map/default.project.json" -Raw
          $null=$project|ConvertFrom-Json
          function Need([string]$text,[string]$token,[string]$label){if($text.IndexOf($token,[StringComparison]::Ordinal)-lt 0){throw "V0.8.2 missing contract: $label"}}

          foreach($token in @(
            '0.8.2-road-sidewalk-intersection-cleanup-1',
            'ASC_RoadConcreteStripCleanupPass',
            'NS_Sidewalk_W', 'NS_Sidewalk_E', 'EW_Sidewalk_N', 'EW_Sidewalk_S',
            'SidewalkW', 'SidewalkE',
            'NorthSouthRoad', 'EastWestRoad', 'SchoolSportsRoad', 'SideStreet', 'CrossStreet',
            'PERPENDICULAR_DOT_MAX = 0.45',
            'return -part.CFrame.LookVector',
            'projectedHalfExtent',
            'SidewalkSegment_',
            'sidewalk:Destroy()',
            'ASC_V082Segment',
            'ASC_V082FailClosed',
            'ASC_AsphaltIntersectionPriority',
            'ASC_RoadSidewalkIntersectionCleanupPass'
          )){Need $fix $token $token}

          Need $world 'part(roads, "NS_Sidewalk_W", Vector3.new(9, 0.8, 570)' 'legacy NS west sidewalk authority'
          Need $world 'part(roads, "EW_Sidewalk_N", Vector3.new(600, 0.8, 9)' 'legacy EW north sidewalk authority'
          Need $street 'part(streetGrid, "SidewalkW", Vector3.new(7, 0.65, 190)' 'legacy side-street sidewalk authority'
          Need $v081 'ASC_RoadConcreteStripCleanupPass' 'V0.8.1 prerequisite authority'

          foreach($forbidden in @('MarketplaceService','PromptProductPurchase','ProcessReceipt','DataStoreService','BillboardGui')){
            if($fix -match [regex]::Escape($forbidden)){throw "Forbidden V0.8.2 scope token: $forbidden"}
          }
          if($fix -match 'road:Destroy\(\)' -or $fix -match 'road\.Size\s*=') { throw 'V0.8.2 may not destroy/resize asphalt roads' }

          foreach($token in @(
            'Version = "0.8.2-road-sidewalk-intersection-cleanup-1"',
            'RoadConcreteStripCleanupVersion = "0.8.1-road-concrete-strip-cleanup-1"',
            'RoadSidewalkIntersectionCleanupVersion = "0.8.2-road-sidewalk-intersection-cleanup-1"',
            'EnableRoadConcreteStripCleanupPass = true',
            'EnableRoadSidewalkIntersectionCleanupPass = true',
            'EnableActivities = false',
            'EnableEconomy = false',
            'EnablePersistence = false',
            'EnablePersonalRoom = false',
            'EnableClubs = false'
          )){Need $config $token $token}

          Need $project 'ASC_RoadConcreteStripCleanup' 'V0.8.1 node'
          Need $project 'ASC_RoadSidewalkIntersectionCleanup' 'V0.8.2 node'
          Need $project 'after-school-city.road-sidewalk-intersection-cleanup.server.lua' 'V0.8.2 source'
          $i81=$project.IndexOf('ASC_RoadConcreteStripCleanup',[StringComparison]::Ordinal)
          $i82=$project.IndexOf('ASC_RoadSidewalkIntersectionCleanup',[StringComparison]::Ordinal)
          if($i81 -lt 0 -or $i82 -le $i81){throw 'Rojo ordering invalid: V0.8.2 must follow V0.8.1'}
          Write-Host 'V0.8.2 CONTRACT PASS asphaltRoads=IMMUTABLE sidewalkIntersections=SPLIT gameplay/economy=OFF'

      - name: Verify LIVE v28 protected source unchanged
        shell: bash
        working-directory: asc-source
        run: |
          set -euo pipefail
          for f in \
            maps/after-school-city/after-school-city.intro.client.lua \
            maps/after-school-city/after-school-city.world.server.lua \
            maps/after-school-city/after-school-city.school-life.server.lua \
            maps/after-school-city/after-school-city.street-life.server.lua \
            maps/after-school-city/after-school-city.spatial-cleanup.server.lua \
            maps/after-school-city/after-school-city.layout-correction.server.lua \
            maps/after-school-city/after-school-city.circulation-sanitize.server.lua \
            maps/after-school-city/after-school-city.orientation-correction.server.lua \
            maps/after-school-city/after-school-city.road-centerline-clearance.server.lua \
            maps/after-school-city/after-school-city.premium-exterior.server.lua \
            maps/after-school-city/after-school-city.school-interior.server.lua \
            maps/after-school-city/after-school-city.school-interior-polish.server.lua \
            maps/after-school-city/after-school-city.school-visual-depth.server.lua \
            maps/after-school-city/after-school-city.signage-orientation-hotfix.server.lua \
            maps/after-school-city/after-school-city.school-architectural-cleanup.server.lua \
            maps/after-school-city/after-school-city.locker-clearance-hotfix.server.lua \
            maps/after-school-city/after-school-city.exterior-locker-cleanup.server.lua \
            maps/after-school-city/after-school-city.school-road-visual-defect-cleanup.server.lua \
            maps/after-school-city/after-school-city.student-row-shop-interiors.server.lua \
            maps/after-school-city/after-school-city.student-row-interior-sign-finalize.server.lua \
            maps/after-school-city/after-school-city.road-concrete-strip-cleanup.server.lua; do
            git diff --quiet "$BASE_LIVE_SHA" "$SOURCE_SHA" -- "$f" || { echo "Protected source changed: $f"; exit 20; }
          done
          grep -Fq 'PUTU AZYA PUTRI' maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'BINTANG HARDAJAYA' maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'WITH LOVE, DAD' maps/after-school-city/after-school-city.intro.client.lua
          echo 'PROTECTED SOURCE PASS v28=UNCHANGED asphaltAuthority=UNCHANGED streetLifeAuthority=UNCHANGED dedication=UNCHANGED'

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || exit 30
          chmod +x "$rojo"
          version=$("$rojo" --version)
          [[ "$version" == *'7.7.0'* ]] || { echo "Wrong Rojo: $version"; exit 31; }
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build exact V0.8.2 place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v082.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          (( bytes > 108466 )) || { echo "Unexpected build size: $bytes"; exit 40; }
          sha=$(sha256sum "$place" | awk '{print $1}')
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD PASS source=$SOURCE_SHA bytes=$bytes sha256=$sha"

      - name: Persist QC receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'QC_PASS' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'ROAD_SIDEWALK_INTERSECTION_CLEANUP_V0_8_2' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg baseLiveCommit "$BASE_LIVE_SHA" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,baseLiveCommit:$baseLiveCommit,rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,checkedAt:$checkedAt,note:"Public rescue hosted QC only; NOT PUBLISHED. V0.8.2 splits legacy long sidewalk strips at perpendicular asphalt-road intersections; asphalt road geometry immutable; protected LIVE v28 source unchanged."}' \
            > deploy-status/after-school-city-v082-public-rescue-qc.json
          cat deploy-status/after-school-city-v082-public-rescue-qc.json
          git config user.name 'After School City QC Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/after-school-city-v082-public-rescue-qc.json
          git commit -m "Record After School City V0.8.2 public rescue QC [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
