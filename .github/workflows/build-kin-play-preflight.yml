name: KIN Google Play Preflight

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "native/kin/**"
      - ".github/workflows/build-kin-play-preflight.yml"

concurrency:
  group: kin-play-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate Google Play baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.ardacore.kin"' native/kin/app/build.gradle.kts
          grep -q 'targetSdk = 36' native/kin/app/build.gradle.kts
          grep -q 'compileSdk = 36' native/kin/app/build.gradle.kts
          grep -q 'android:usesCleartextTraffic="false"' native/kin/app/src/main/AndroidManifest.xml
          test -f native/kin/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          if grep -R "android.webkit.WebView\|<WebView" -n native/kin/app/src/main; then
            echo "WebView usage is forbidden in KIN."
            exit 1
          fi

      - name: Compile release Android App Bundle
        shell: bash
        working-directory: native/kin
        run: |
          set -euo pipefail
          gradle --no-daemon :app:bundleRelease --stacktrace \
            -PKIN_VERSION_CODE=${{ github.run_number }} \
            -PKIN_VERSION_NAME=0.3.${{ github.run_number }}

      - name: Stage unsigned preflight AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native/kin/app/build/outputs/bundle/release/app-release.aab dist/KIN-Play-Preflight-v0.3.${{ github.run_number }}-UNSIGNED.aab
          sha256sum dist/KIN-Play-Preflight-v0.3.${{ github.run_number }}-UNSIGNED.aab

      - name: Upload preflight AAB
        uses: actions/upload-artifact@v4
        with:
          name: KIN-Play-Preflight-v0.3.${{ github.run_number }}
          path: dist/KIN-Play-Preflight-v0.3.${{ github.run_number }}-UNSIGNED.aab
          retention-days: 30
