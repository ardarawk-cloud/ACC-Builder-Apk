name: Build BWD Owner Fixed

on:
  push:
    branches:
      - feat/bali-wedding-dj-cloud-v2
    paths:
      - ".github/workflows/build-bwd-owner-fixed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore native project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            native/bali-wedding-dj-src/part00.b64 \
            native/bali-wedding-dj-src/part01-0.b64 \
            native/bali-wedding-dj-src/part01-1.b64 \
            native/bali-wedding-dj-src/part01-2.b64 \
            native/bali-wedding-dj-src/part01-3.b64 \
            native/bali-wedding-dj-src/part01-4.b64 \
            native/bali-wedding-dj-src/part01-5.b64 \
            native/bali-wedding-dj-src/part02.b64 \
            native/bali-wedding-dj-src/part03.b64 \
            native/bali-wedding-dj-src/part04.b64 > /tmp/bwd.b64
          test "$(wc -c < /tmp/bwd.b64)" = "27968"
          base64 -d /tmp/bwd.b64 > /tmp/bwd.tar.gz
          echo "86cba805905897f5c48350be8bfa36a1b6164ba2f455ed93a0c0865c31905650  /tmp/bwd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bwd.tar.gz

      - name: Load Firebase config
        shell: bash
        env:
          BWD_ANDROID_FIREBASE_CONFIG_JSON: ${{ secrets.BWD_ANDROID_FIREBASE_CONFIG_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          raw=os.environ.get('BWD_ANDROID_FIREBASE_CONFIG_JSON','').strip()
          if not raw:
              raise SystemExit('Missing BWD_ANDROID_FIREBASE_CONFIG_JSON')
          cfg=json.loads(raw)
          info=cfg.get('project_info') or {}
          if info.get('project_id') != 'bali-wedding-dj':
              raise SystemExit('Unexpected Firebase project')
          clients=cfg.get('client') or []
          if not clients:
              raise SystemExit('Firebase JSON has no Android client')
          api=((clients[0].get('api_key') or [{}])[0]).get('current_key','')
          values={
              'BWD_FIREBASE_API_KEY':api,
              'BWD_FIREBASE_APP_ID':'1:636975525713:android:83154d5ed58d8a01032d70',
              'BWD_FIREBASE_OWNER_APP_ID':'1:636975525713:android:dd919e7631eba662032d70',
              'BWD_FIREBASE_PROJECT_ID':'bali-wedding-dj',
              'BWD_FIREBASE_SENDER_ID':'636975525713',
              'BWD_CLOUD_BASE_URL':'https://bali-wedding-dj-booking.ardarawk.workers.dev',
          }
          if not api:
              raise SystemExit('Firebase API key missing')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for k,v in values.items(): f.write(f'{k}={v}\n')
          print('Firebase runtime values loaded')
          PY

      - name: Apply cloud patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_bwd_business_contact.py bwd-native
          python3 scripts/patch_bwd_cloud_v2.py bwd-native
          python3 scripts/patch_bwd_receipt_cloud.py bwd-native
          touch bwd-native/gradle.properties
          grep -q '^android.useAndroidX=' bwd-native/gradle.properties && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' bwd-native/gradle.properties || echo 'android.useAndroidX=true' >> bwd-native/gradle.properties
          grep -q '^android.suppressUnsupportedCompileSdk=' bwd-native/gradle.properties && sed -i 's/^android.suppressUnsupportedCompileSdk=.*/android.suppressUnsupportedCompileSdk=36/' bwd-native/gradle.properties || echo 'android.suppressUnsupportedCompileSdk=36' >> bwd-native/gradle.properties

      - name: Create Owner app
        shell: bash
        run: |
          set -euo pipefail
          cp -a bwd-native bwd-admin
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle=Path('bwd-admin/app/build.gradle')
          s=gradle.read_text()
          s,n=re.subn(r'(?m)^(\s*)applicationId\s+["\'][^"\']+["\']',r'\1applicationId "com.baliweddingdj.owner"',s,count=1)
          if n!=1: raise SystemExit('Owner applicationId patch failed')
          gradle.write_text(s)
          strings=Path('bwd-admin/app/src/main/res/values/strings.xml')
          if strings.exists():
              t=strings.read_text()
              t=re.sub(r'(<string\s+name="app_name">).*?(</string>)',r'\1Bali Wedding DJ Owner\2',t,count=1)
              strings.write_text(t)
          PY
          python3 scripts/patch_bwd_owner_dashboard.py bwd-admin
          python3 scripts/patch_bwd_owner_cloud_inbox.py bwd-admin
          grep -q 'ENABLE CLOUD NOTIFICATIONS' bwd-admin/app/src/main/java/com/baliweddingdj/app/MainActivity.java
          grep -q 'BwdCloud.showAdminEnrollment(this)' bwd-admin/app/src/main/java/com/baliweddingdj/app/MainActivity.java
          grep -q 'BwdOwnerCloud.sync' bwd-admin/app/src/main/java/com/baliweddingdj/app/MainActivity.java

      - name: Verify Owner runtime config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('bwd-admin/app/build.gradle').read_text()
          def v(name):
              m=re.search(r'buildConfigField\s+"String",\s+"'+re.escape(name)+r'",\s+"\\"(.*?)\\""',text)
              return m.group(1) if m else ''
          required=['BWD_FIREBASE_API_KEY','BWD_FIREBASE_APP_ID','BWD_FIREBASE_PROJECT_ID','BWD_FIREBASE_SENDER_ID','BWD_CLOUD_BASE_URL']
          missing=[x for x in required if not v(x)]
          if missing: raise SystemExit('Missing Owner runtime config: '+', '.join(missing))
          if v('BWD_FIREBASE_APP_ID')!='1:636975525713:android:dd919e7631eba662032d70':
              raise SystemExit('Wrong Owner Firebase app id')
          if v('BWD_CLOUD_BASE_URL')!='https://bali-wedding-dj-booking.ardarawk.workers.dev':
              raise SystemExit('Wrong Owner cloud URL')
          print('Owner runtime config READY')
          PY

      - name: Build Owner APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd bwd-admin && gradle --no-daemon :app:assembleDebug --stacktrace)
          cp bwd-admin/app/build/outputs/apk/debug/app-debug.apk dist/BALI-WEDDING-DJ-OWNER-FIXED-debug.apk

      - name: Verify Owner APK
        shell: bash
        run: |
          set -euo pipefail
          OWNER_ID=$(apkanalyzer manifest application-id dist/BALI-WEDDING-DJ-OWNER-FIXED-debug.apk)
          echo "Owner applicationId: ${OWNER_ID}"
          test "${OWNER_ID}" = "com.baliweddingdj.owner"
          sha256sum dist/BALI-WEDDING-DJ-OWNER-FIXED-debug.apk

      - name: Upload Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: BALI-WEDDING-DJ-OWNER-FIXED
          path: dist/BALI-WEDDING-DJ-OWNER-FIXED-debug.apk
          retention-days: 30

# secret-refresh build trigger 2026-09-13
