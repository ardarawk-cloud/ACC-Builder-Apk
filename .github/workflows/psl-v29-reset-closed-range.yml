name: PSL v29 Reset Closed Range

on:
  push:
    branches: [main]
    paths:
      - "psl-v29-reset-trigger/*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Apply v29 patch
        run: python3 scripts/psl_v29_reset_closed_range.py

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          F=apps/papa-sauce-lab/index.html
          grep -q 'PSL_V29_RESET_CLOSED_RANGE' "$F"
          grep -q 'PSL_V28_MONTH_OPENING_CARRY_FIX' "$F"
          grep -q 'PSL_V27_STICKY_OPERATIONAL_DATE' "$F"
          grep -q 'RESET_DATE_RANGE' "$F"
          grep -q 'totalRegister:houseBank+totalSales-totalOut' "$F"
          grep -q 'closingRegister:c.totalRegister' "$F"
          grep -q 'MutationObserver' "$F" && { echo 'Unsafe observer found'; exit 1; } || true

      - name: Bump metadata and request V2 build
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('apps/papa-sauce-lab/project.json')
          m=json.loads(p.read_text())
          m['version']=29
          m['provider']='manual-hotfix'
          m['model']='none'
          m['qc']='passed'
          m['last_request_id']='papa-sauce-lab-v29-reset-closed-range'
          m['last_prompt']='Owner-only audited reset of a closed date range so incorrect days can be re-entered from the prior valid closing balance.'
          m['last_build']='pending'
          m['updated_at']=datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')

          r=Path('psl-v2-build-requests/v29-reset-closed-range-20261011.json')
          r.write_text(json.dumps({
            'request_id':'papa-sauce-lab-v2-v29-reset-closed-range',
            'project_id':'papa-sauce-lab',
            'version':29,
            'mode':'stable_signed_update',
            'reason':'Reset erroneous closed day range while keeping prior day balance and audit archive'
          },indent=2)+'\n')
          PY

      - name: Commit v29 patch
        shell: bash
        run: |
          git config user.name "ACC PSL Builder"
          git config user.email "actions@users.noreply.github.com"
          git add apps/papa-sauce-lab/index.html apps/papa-sauce-lab/project.json psl-v2-build-requests/v29-reset-closed-range-20261011.json
          git commit -m "PSL v29: reset erroneous closed date range" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
