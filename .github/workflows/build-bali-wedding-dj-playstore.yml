name: Build Bali Wedding DJ Play Store Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Play Store versionCode (must always increase)
        required: true
        default: "2"
      version_name:
        description: Public versionName
        required: true
        default: "1.1.0"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BWD_KEYSTORE_PASSWORD: ${{ secrets.BWD_KEYSTORE_PASSWORD }}
      BWD_KEY_ALIAS: ${{ secrets.BWD_KEY_ALIAS }}
      BWD_KEY_PASSWORD: ${{ secrets.BWD_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore native project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            native/bali-wedding-dj-src/part00.b64 \
            native/bali-wedding-dj-src/part01-0.b64 \
            native/bali-wedding-dj-src/part01-1.b64 \
            native/bali-wedding-dj-src/part01-2.b64 \
            native/bali-wedding-dj-src/part01-3.b64 \
            native/bali-wedding-dj-src/part01-4.b64 \
            native/bali-wedding-dj-src/part01-5.b64 \
            native/bali-wedding-dj-src/part02.b64 \
            native/bali-wedding-dj-src/part03.b64 \
            native/bali-wedding-dj-src/part04.b64 > /tmp/bwd.b64
          test "$(wc -c < /tmp/bwd.b64)" = "27968"
          base64 -d /tmp/bwd.b64 > /tmp/bwd.tar.gz
          echo "86cba805905897f5c48350be8bfa36a1b6164ba2f455ed93a0c0865c31905650  /tmp/bwd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bwd.tar.gz
          test -f bwd-native/app/build.gradle
          test -f bwd-native/app/src/main/AndroidManifest.xml
          if grep -R "WebView" -n bwd-native/app/src/main/java; then
            echo "WebView usage is forbidden for Bali Wedding DJ."
            exit 1
          fi

      - name: Apply production wording and versioning
        shell: bash
        run: |
          set -euo pipefail
          find bwd-native/app/src/main/java -name '*.java' -print0 | xargs -0 sed -i 's/"Reception"/"Wedding Reception"/g'
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p = Path('bwd-native/app/build.gradle')
          s = p.read_text()
          s, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {os.environ["VERSION_CODE"]}', s, count=1)
          s, n2 = re.subn(r'versionName\s+["\'][^"\']+["\']', f'versionName "{os.environ["VERSION_NAME"]}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Unable to patch versionCode/versionName safely')
          if 'applicationId "com.baliweddingdj.app"' not in s and "applicationId 'com.baliweddingdj.app'" not in s:
              raise SystemExit('Package ID drift detected; expected com.baliweddingdj.app')
          p.write_text(s)
          PY
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}

      - name: Restore private upload keystore
        shell: bash
        env:
          BWD_UPLOAD_KEYSTORE_B64: ${{ secrets.BWD_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$BWD_UPLOAD_KEYSTORE_B64"
          test -n "$BWD_KEYSTORE_PASSWORD"
          test -n "$BWD_KEY_ALIAS"
          test -n "$BWD_KEY_PASSWORD"
          printf '%s' "$BWD_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bwd-upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/bwd-upload-key.jks" -storepass "$BWD_KEYSTORE_PASSWORD" -alias "$BWD_KEY_ALIAS" >/dev/null

      - name: Configure release signing
        shell: bash
        run: |
          cat >> bwd-native/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  bwdRelease {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/bwd-upload-key.jks")
                      storePassword System.getenv("BWD_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("BWD_KEY_ALIAS")
                      keyPassword System.getenv("BWD_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.bwdRelease
                      debuggable false
                  }
              }
          }
          GRADLE

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          cd bwd-native
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/BALI-WEDDING-DJ-${{ inputs.version_name }}-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/BALI-WEDDING-DJ-${{ inputs.version_name }}-playstore.aab

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/BALI-WEDDING-DJ-${{ inputs.version_name }}-release.apk
          test -s dist/BALI-WEDDING-DJ-${{ inputs.version_name }}-playstore.aab
          jarsigner -verify -verbose -certs dist/BALI-WEDDING-DJ-${{ inputs.version_name }}-playstore.aab >/dev/null
          sha256sum dist/*

      - name: Upload Play Store release bundle
        uses: actions/upload-artifact@v4
        with:
          name: BALI-WEDDING-DJ-${{ inputs.version_name }}-PLAYSTORE
          path: |
            dist/BALI-WEDDING-DJ-${{ inputs.version_name }}-release.apk
            dist/BALI-WEDDING-DJ-${{ inputs.version_name }}-playstore.aab
          retention-days: 30
