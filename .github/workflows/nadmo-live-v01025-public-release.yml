name: Publish NADMO LIVE v0.10.25 verified Android APK
on:
  push:
    branches:
      - feat/nadmo-radio-open-music-camera-stage-20261012
    paths:
      - nadmo-live/android/release-requests/v0.10.25-public.txt
permissions:
  contents: write
concurrency:
  group: nadmo-live-v01025-public
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate Android identity and offline entrypoint
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'id.nadmo.live'" nadmo-live/android/app/build.gradle
          grep -q "versionCode 44" nadmo-live/android/app/build.gradle
          grep -q "versionName '0.10.25'" nadmo-live/android/app/build.gradle
          node nadmo-live/android/qa/offgrid-local-contract.mjs
      - name: Load protected original signing identity
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NADMO_LIVE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.NADMO_LIVE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NADMO_LIVE_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NADMO_LIVE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS"; do
            test -n "$value" || { echo "::error::Existing signing secret unavailable"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nadmo-release.jks"
          test -s "$RUNNER_TEMP/nadmo-release.jks"
          echo "NADMO_LIVE_RELEASE_STORE_FILE=$RUNNER_TEMP/nadmo-release.jks" >> "$GITHUB_ENV"
          echo "NADMO_LIVE_RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "NADMO_LIVE_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NADMO_LIVE_RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Build original signed APK
        run: gradle -p nadmo-live/android :app:assembleRelease --no-daemon
      - name: Verify signature, version, package and hash
        shell: bash
        run: |
          set -euo pipefail
          APK=nadmo-live/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SIGN=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          echo "$SIGN" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          ACTUAL=$(echo "$SIGN" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1)
          EXPECTED=$(jq -r '.certificate_sha256' nadmo-live/android/release-identity.json)
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::Signer mismatch"; exit 1; }
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='id.nadmo.live'"
          echo "$BADGING" | grep -F "versionCode='44'"
          echo "$BADGING" | grep -F "versionName='0.10.25'"
          mkdir -p dist
          cp "$APK" dist/NADMO-LIVE-v0.10.25.apk
          (cd dist && sha256sum NADMO-LIVE-v0.10.25.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: nadmo-live-v0.10.25-verified
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed APK as immutable public beta release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=nadmo-live-v0.10.25
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Published tag already exists, refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" dist/NADMO-LIVE-v0.10.25.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NADMO LIVE v0.10.25 - signed Android beta" \
            --notes "Official beta, package id.nadmo.live, versionCode 44. Original owner certificate verified. OFFGRID embedded; physical three-device mesh verification pending. Public download: https://download.nadmo.id." \
            --prerelease --latest=false
          echo "Public NADMO download: https://download.nadmo.id" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nadmo-release.jks"
