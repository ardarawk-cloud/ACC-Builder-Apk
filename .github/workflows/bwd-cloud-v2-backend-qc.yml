name: BWD Cloud V2 Backend QC

on:
  push:
    branches:
      - feat/bali-wedding-dj-cloud-v2
    paths:
      - "backend/bwd-cloud-v2/**"
      - ".github/workflows/bwd-cloud-v2-backend-qc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-qc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/bwd-cloud-v2/functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/bwd-cloud-v2/functions/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Syntax check
        run: node --check index.js

      - name: Dependency tree
        run: npm ls --depth=0
