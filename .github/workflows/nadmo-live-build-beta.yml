name: NADMO LIVE APK beta
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/nadmo-live-android-beta-20261009'
    paths:
      - 'nadmo-live/android/**'
      - '.github/workflows/nadmo-live-build-beta.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Android SDK
        run: |
          echo "Android SDK: ${ANDROID_HOME}"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        run: gradle -p nadmo-live/android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nadmo-live-android-beta-debug
          path: nadmo-live/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
