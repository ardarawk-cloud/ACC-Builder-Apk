name: Build ACC DJ Permanent Release

on:
  push:
    branches: [main]
    paths:
      - "release-requests/acc-dj-v12-drive.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build unsigned release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/acc-dj-release"
          mkdir -p "$BUILD_DIR/www"
          cp apps/acc-dj/index.html "$BUILD_DIR/www/index.html"
          cp apps/acc-dj/v12.css "$BUILD_DIR/www/v12.css"
          cp apps/acc-dj/v12.js "$BUILD_DIR/www/v12.js"

          # Vendor the verified DJ engine into the APK and expose a narrow local-file loader.
          curl -fsSL "https://raw.githubusercontent.com/balinightlife666-web/DJ-AM/90a5af34d641f29992c8ecfe245e6cda833dbf2c/app-v8.js" -o "$BUILD_DIR/www/app-v8.js"
          python3 - <<'PY'
          from pathlib import Path
          html = Path("$BUILD_DIR/www/index.html")
          s = html.read_text()
          remote = "https://cdn.jsdelivr.net/gh/balinightlife666-web/DJ-AM@90a5af34d641f29992c8ecfe245e6cda833dbf2c/app-v8.js"
          if remote not in s:
              raise SystemExit("ACC DJ engine script marker not found")
          s = s.replace(remote, "./app-v8.js", 1)
          s = s.replace("</head>", '  <link rel="stylesheet" href="./v12.css">\n</head>', 1)
          s = s.replace("</body>", '  <script src="./v12.js"></script>\n</body>', 1)
          html.write_text(s)

          core = Path("$BUILD_DIR/www/app-v8.js")
          js = core.read_text()
          marker = "})();"
          pos = js.rfind(marker)
          if pos < 0:
              raise SystemExit("ACC DJ core closure marker not found")
          hook = r'''

          // Android/Drive bridge for ACC DJ v1.2. This stays inside the core closure so
          // local files use the same Web Audio graph, EQ, crossfader, meters and transport.
          window.ACCDJCore = window.ACCDJCore || {};
          window.ACCDJCore.loadLocal = async function(id, file) {
            if (!file || !['A','B'].includes(id)) throw new Error('Invalid local track');
            await initAudio();
            const deck = state.decks[id];
            if (!deck) throw new Error('Deck not ready');
            deck.audio.pause();
            try { if (deck.localObjectUrl) URL.revokeObjectURL(deck.localObjectUrl); } catch (_) {}
            disableSync(id, true);
            deck.audio.playbackRate = 1;
            const pitch = $(`pitch${id}`); if (pitch) pitch.value = 0;
            const pitchLabel = $(`pitchLabel${id}`); if (pitchLabel) pitchLabel.textContent = '0.0%';
            const cleanName = String(file.name || 'Local Track').replace(/\.[^.]+$/, '').replace(/_/g, ' ');
            deck.track = {
              id: `local:${file.name}:${file.size}:${file.lastModified}`,
              title: cleanName,
              artist: 'Drive / Files',
              artwork: '',
              genre: 'Local',
              bpm: null,
              key: null,
              duration: 0,
              local: true
            };
            deck.beatAnchor = NaN; deck.beatConfidence = 0; deck.prevLowEnergy = 0; deck.fluxAvg = 0; deck.lastOnsetMedia = -99;
            updateGridUi(id);
            const url = URL.createObjectURL(file);
            deck.localObjectUrl = url;
            deck.primaryStreamUrl = url;
            deck.fallbackStreamUrl = '';
            deck.streamAttempt = 1;
            deck.audio.src = url;
            deck.audio.load();
            $(`title${id}`).textContent = cleanName;
            $(`artist${id}`).textContent = 'Drive / Files';
            const cover = $(`cover${id}`);
            if (cover) cover.src = 'https://cdn.jsdelivr.net/gh/balinightlife666-web/DJ-AM@90a5af34d641f29992c8ecfe245e6cda833dbf2c/icon-192.png';
            $(`bpm${id}`).textContent = 'BPM ANALYZE';
            $(`key${id}`).textContent = 'KEY —';
            $(`grid${id}`).textContent = 'ANALYZE';
            $(`seek${id}`).value = 0;
            $(`time${id}`).textContent = '00:00';
            $(`duration${id}`).textContent = '00:00';
            setSyncUi(id, false);
            setMessage(`${cleanName} → Deck ${id} loaded dari Drive / Files.`);
            return true;
          };
          '''
          core.write_text(js[:pos] + hook + "\n" + js[pos:])
          PY

          cd "$BUILD_DIR"
          cat > package.json <<'JSON'
          {
            "name":"acc-dj-release",
            "version":"1.2.0",
            "private":true,
            "dependencies":{"@capacitor/core":"^7.0.0","@capacitor/android":"^7.0.0"},
            "devDependencies":{"@capacitor/cli":"^7.0.0"}
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId":"com.acc.dj",
            "appName":"ACC DJ",
            "webDir":"www",
            "server":{"androidScheme":"https"}
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          RES="$BUILD_DIR/android/app/src/main/res"
          mkdir -p "$RES/mipmap-anydpi"
          find "$RES" -type f \( -name 'ic_launcher*.png' -o -name 'ic_launcher*.webp' \) -delete
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          cp "$GITHUB_WORKSPACE/apps/acc-dj/icon-android.xml" "$RES/mipmap-anydpi/ic_launcher.xml"
          cp "$GITHUB_WORKSPACE/apps/acc-dj/icon-android.xml" "$RES/mipmap-anydpi/ic_launcher_round.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 3', s, count=1)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.2.0"', s, count=1)
          if 'applicationId "com.acc.dj"' not in s and "applicationId 'com.acc.dj'" not in s:
              raise SystemExit('Package drift: expected com.acc.dj')
          p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          x=m.read_text()
          if 'android:screenOrientation="landscape"' not in x:
              x=x.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:screenOrientation="landscape"')
          m.write_text(x)
          PY

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist-acc-dj"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/dist-acc-dj/ACC-DJ-1.2.0-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist-acc-dj/ACC-DJ-1.2.0-unsigned.aab"
          cd "$GITHUB_WORKSPACE"
          sha256sum dist-acc-dj/* > dist-acc-dj/SHA256SUMS.txt

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: ACC-DJ-1.2.0-UNSIGNED
          path: dist-acc-dj/
          retention-days: 3
