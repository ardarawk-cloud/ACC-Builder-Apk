name: PSL v13 Closed Stockout Fix

on:
  push:
    branches: [main]
    paths:
      - "psl-v13-closed-stockout-trigger/*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Apply v13 closed stockout patch
        run: python3 scripts/psl_v13_closed_stockout_fix.py

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          F=apps/papa-sauce-lab/index.html
          grep -q 'PSL_V13_CLOSED_STOCKOUT_CORRECTION' "$F"
          grep -q 'late_stockout_after_close' "$F"
          grep -q 'snapshotUnchanged:true' "$F"
          grep -q 'PSL_V12_STOCK_HISTORY_FIX' "$F"
          grep -q 'PSL_V11_SMART_SALE_PREMIUM' "$F"
          grep -q 'PSL_V10_TRANSACTION_EDIT' "$F"
          grep -q 'PSL_V5_BACKDATE_HB_PATCH' "$F"
          grep -q 'MutationObserver' "$F" && { echo 'Unsafe observer found'; exit 1; } || true
          test "$(head -c 15 "$F")" = '<!DOCTYPE html>'
          tail -n 8 "$F" | grep -q '</html>'

      - name: Bump v13 metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('apps/papa-sauce-lab/project.json')
          m=json.loads(p.read_text())
          m['version']=13
          m['provider']='manual-hotfix'
          m['model']='none'
          m['qc']='passed'
          m['last_request_id']='papa-sauce-lab-closed-stockout-v13-20260912'
          m['last_prompt']='Allow OWNER to add late Stock Keluar corrections to CLOSED operational dates without overwriting immutable snapshots; preserve v12 stock history/drilldown, v11 Smart Sale, v10 transaction correction, v9 closed restock correction and accounting formulas.'
          m['last_build']='pending'
          m['updated_at']=datetime.now(timezone.utc).isoformat()
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Commit v13 patch
        shell: bash
        run: |
          git config user.name "ACC PSL Builder"
          git config user.email "actions@users.noreply.github.com"
          git add apps/papa-sauce-lab/index.html apps/papa-sauce-lab/project.json
          git commit -m "PSL v13: allow closed stockout correction" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
