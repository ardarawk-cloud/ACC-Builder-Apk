name: Build KIN Native APK

on:
  push:
    branches:
      - feat/kin-foundation-v1
    paths:
      - "native/kin/**"
      - ".github/workflows/build-kin-native.yml"
      - "kin-native.trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Native-only guard
        shell: bash
        run: |
          set -euo pipefail
          test -f native/kin/app/src/main/java/com/kin/app/MainActivity.kt
          test -f native/kin/app/src/main/java/com/kin/app/ui/KinApp.kt
          test -f native/kin/app/src/main/AndroidManifest.xml
          if grep -R "android.webkit.WebView\|<WebView" -n native/kin/app/src/main; then
            echo "WebView usage is forbidden in the KIN native shell."
            exit 1
          fi

      - name: Build KIN debug APK
        shell: bash
        working-directory: native/kin
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native/kin/app/build/outputs/apk/debug/app-debug.apk dist/KIN-Phase0-v0.1-debug.apk
          sha256sum dist/KIN-Phase0-v0.1-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KIN-Phase0-v0.1
          path: dist/KIN-Phase0-v0.1-debug.apk
          retention-days: 30
