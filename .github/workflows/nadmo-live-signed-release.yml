name: NADMO LIVE Consistently Signed APK
on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/nadmo-live-android-beta-20261009'
    paths:
      - 'nadmo-live/android/release-requests/**'
permissions:
  contents: write
jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Require permanently protected signing credentials
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NADMO_LIVE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.NADMO_LIVE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NADMO_LIVE_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NADMO_LIVE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ];then
            echo "::error::Protected NADMO LIVE release signing secrets are not configured. No APK will be published."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nadmo-release.jks"
          test -s "$RUNNER_TEMP/nadmo-release.jks"
          echo "NADMO_LIVE_RELEASE_STORE_FILE=$RUNNER_TEMP/nadmo-release.jks" >> "$GITHUB_ENV"
          echo "NADMO_LIVE_RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "NADMO_LIVE_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NADMO_LIVE_RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Verify offline OFFGRID bundled page and HTTPS fallback behavior
        run: node nadmo-live/android/qa/offgrid-local-contract.mjs
      - name: Assemble signed release
        run: gradle -p nadmo-live/android :app:assembleRelease --no-daemon
      - name: Verify release signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="nadmo-live/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIGNING_REPORT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$SIGNING_REPORT"
          printf '%s\n' "$SIGNING_REPORT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          EXPECTED=$(jq -r '.certificate_sha256' nadmo-live/android/release-identity.json)
          ACTUAL=$(printf '%s\n' "$SIGNING_REPORT" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1)
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ];then
            echo "::error::NADMO LIVE release certificate changed. Expected $EXPECTED, got $ACTUAL. Refusing unsafe update."
            exit 1
          fi
          INFO=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1)
          echo "$INFO"
          PACKAGE=$(jq -r '.package_id' nadmo-live/android/release-identity.json)
          echo "$INFO" | grep -Fq "name='$PACKAGE'"
          if unzip -l "$APK" | grep -q "nadmo-release.jks";then echo "Keystore leak detected"; exit 1; fi
          mv "$APK" "nadmo-live/android/app/build/outputs/apk/release/NADMO-LIVE-signed-beta.apk"
          (cd nadmo-live/android/app/build/outputs/apk/release && sha256sum NADMO-LIVE-signed-beta.apk > SHA256SUMS.txt)
          echo "Locked signing certificate verified. Package $PACKAGE."
      - uses: actions/upload-artifact@v4
        with:
          name: nadmo-live-signed-apk
          path: |
            nadmo-live/android/app/build/outputs/apk/release/NADMO-LIVE-signed-beta.apk
            nadmo-live/android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified APK for direct download (not an Actions ZIP)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nadmo-live-v0.9.3-beta"
          SOURCE="nadmo-live/android/app/build/outputs/apk/release/NADMO-LIVE-signed-beta.apk"
          OUTPUT="$RUNNER_TEMP/NADMO-LIVE-v0.9.3-beta.apk"
          test -s "$SOURCE"
          META=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SOURCE" | head -1)
          printf '%s\\n' "$META"
          printf '%s\\n' "$META" | grep -F "name='id.nadmo.live'"
          printf '%s\\n' "$META" | grep -F "versionCode='12'"
          printf '%s\\n' "$META" | grep -F "versionName='0.9.3-beta'"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Refusing to overwrite a published APK."
            exit 1
          fi
          cp "$SOURCE" "$OUTPUT"
          (cd "$RUNNER_TEMP" && sha256sum "NADMO-LIVE-v0.9.3-beta.apk" > "NADMO-LIVE-v0.9.3-beta.sha256")
          gh release create "$TAG" "$OUTPUT" "$RUNNER_TEMP/NADMO-LIVE-v0.9.3-beta.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NADMO LIVE v0.9.3-beta — Android APK signed" \
            --notes "Official NADMO LIVE Android beta, package id.nadmo.live, versionCode 12. Signed with the existing verified owner signing certificate. Direct APK download: no ZIP extraction required. The offline-bundled fallback launches installed OFFGRID Alpha with BLE chats/groups, plus the corporate footer. Actual offline messaging is not available; online LIVE/SOSIAL/PESAN/ME still require server connectivity. Install only if you trust NADMO and back up important data." \
            --prerelease --latest=false
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/NADMO-LIVE-v0.9.3-beta.apk"
          echo "Direct verified signed APK: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Wipe signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nadmo-release.jks"
