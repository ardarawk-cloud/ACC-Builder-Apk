name: BWD Play Store API 36 Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bwd-playstore-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore native source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            native/bali-wedding-dj-src/part00.b64 \
            native/bali-wedding-dj-src/part01-0.b64 \
            native/bali-wedding-dj-src/part01-1.b64 \
            native/bali-wedding-dj-src/part01-2.b64 \
            native/bali-wedding-dj-src/part01-3.b64 \
            native/bali-wedding-dj-src/part01-4.b64 \
            native/bali-wedding-dj-src/part01-5.b64 \
            native/bali-wedding-dj-src/part02.b64 \
            native/bali-wedding-dj-src/part03.b64 \
            native/bali-wedding-dj-src/part04.b64 > /tmp/bwd.b64
          test "$(wc -c < /tmp/bwd.b64)" = "27968"
          base64 -d /tmp/bwd.b64 > /tmp/bwd.tar.gz
          echo "86cba805905897f5c48350be8bfa36a1b6164ba2f455ed93a0c0865c31905650  /tmp/bwd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bwd.tar.gz

      - name: Patch API 36 and production wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('bwd-native/build.gradle')
          rs = root.read_text()
          changed = 0
          rs, n = re.subn(r"(id\s+['\"]com\.android\.application['\"]\s+version\s+['\"])[^'\"]+(['\"])", r"\g<1>8.9.1\2", rs, count=1)
          changed += n
          rs, n = re.subn(r"(com\.android\.tools\.build:gradle:)[0-9A-Za-z.\-]+", r"\g<1>8.9.1", rs, count=1)
          changed += n
          if changed == 0:
              raise SystemExit('AGP version not found')
          root.write_text(rs)

          app = Path('bwd-native/app/build.gradle')
          s = app.read_text()
          s, c1 = re.subn(r'compileSdk\s*(?:=\s*)?\d+', 'compileSdk 36', s, count=1)
          s, c2 = re.subn(r'targetSdk\s*(?:=\s*)?\d+', 'targetSdk 36', s, count=1)
          s, c3 = re.subn(r'versionCode\s+\d+', 'versionCode 2', s, count=1)
          s, c4 = re.subn(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.1.0"', s, count=1)
          if min(c1,c2,c3,c4) != 1:
              raise SystemExit('Gradle config patch failed')
          if 'com.baliweddingdj.app' not in s:
              raise SystemExit('Package identity drift')
          app.write_text(s)
          PY
          find bwd-native/app/src/main/java -name '*.java' -print0 | xargs -0 sed -i 's/"Reception"/"Wedding Reception"/g'
          if grep -R "WebView" -n bwd-native/app/src/main/java; then exit 1; fi

      - name: Build API 36 release bundle preflight
        shell: bash
        run: |
          cd bwd-native
          gradle --no-daemon :app:bundleRelease --stacktrace
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned preflight AAB
        uses: actions/upload-artifact@v4
        with:
          name: BWD-API36-PREFLIGHT-UNSIGNED
          path: bwd-native/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
