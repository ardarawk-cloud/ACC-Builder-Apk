name: BWD Cloud V2 QC

on:
  push:
    branches:
      - feat/bali-wedding-dj-cloud-v2
    paths:
      - "native/bali-wedding-dj-src/**"
      - "scripts/patch_bwd_cloud_v2.py"
      - ".github/workflows/bwd-cloud-v2-qc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore native source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            native/bali-wedding-dj-src/part00.b64 \
            native/bali-wedding-dj-src/part01-0.b64 \
            native/bali-wedding-dj-src/part01-1.b64 \
            native/bali-wedding-dj-src/part01-2.b64 \
            native/bali-wedding-dj-src/part01-3.b64 \
            native/bali-wedding-dj-src/part01-4.b64 \
            native/bali-wedding-dj-src/part01-5.b64 \
            native/bali-wedding-dj-src/part02.b64 \
            native/bali-wedding-dj-src/part03.b64 \
            native/bali-wedding-dj-src/part04.b64 > /tmp/bwd.b64
          test "$(wc -c < /tmp/bwd.b64)" = "27968"
          base64 -d /tmp/bwd.b64 > /tmp/bwd.tar.gz
          echo "86cba805905897f5c48350be8bfa36a1b6164ba2f455ed93a0c0865c31905650  /tmp/bwd.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bwd.tar.gz

      - name: Upload restored source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: bwd-native-restored-source
          path: bwd-native
          retention-days: 2

      - name: Apply cloud v2 patch when present
        shell: bash
        run: |
          if [ -f scripts/patch_bwd_cloud_v2.py ]; then
            python3 scripts/patch_bwd_cloud_v2.py bwd-native
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build patched APK
        shell: bash
        run: |
          set -euo pipefail
          cd bwd-native
          gradle --no-daemon :app:assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/BALI-WEDDING-DJ-Cloud-v2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BALI-WEDDING-DJ-Cloud-v2-debug
          path: dist/BALI-WEDDING-DJ-Cloud-v2-debug.apk
          retention-days: 7
