name: ACC Builder - Generate and Build APK

on:
  push:
    branches: [main]
    paths:
      - "requests/*.json"
  workflow_dispatch:
    inputs:
      request_file:
        description: "Request file path, e.g. requests/123.json"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: acc-ai-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="${{ inputs.request_file }}"
          else
            FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^requests/.*\.json$' | tail -n 1)"
          fi
          test -n "$FILE" && test -f "$FILE" || { echo "Request file not found"; exit 1; }
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Read request metadata
        id: meta
        shell: bash
        run: |
          python3 - "${{ steps.request.outputs.file }}" <<'PY'
          import json, os, re, sys
          req=json.load(open(sys.argv[1], encoding='utf-8'))
          def safe(v):
              x=re.sub(r'[^a-z0-9-_]+','-',str(v).lower())
              return re.sub(r'-+','-',x).strip('-')[:60] or 'app'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('mode='+str(req.get('mode') or 'generate')+'\n')
              f.write('project_id='+safe(req['project_id'])+'\n')
              f.write('app_name='+str(req.get('project_name') or 'ACC App').replace('\n',' ')[:50]+'\n')
              f.write('request_id='+str(req['request_id']).replace('\n',' ')+'\n')
          PY

      - name: Generate application with AI
        if: steps.meta.outputs.mode != 'build_existing'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python3 scripts/ai_generate.py "${{ steps.request.outputs.file }}"

      - name: Resolve app metadata
        id: app
        shell: bash
        run: |
          PROJECT="${{ steps.meta.outputs.project_id }}"
          test -f "apps/$PROJECT/index.html" || { echo "App HTML missing"; exit 1; }
          test -f "apps/$PROJECT/project.json" || { echo "Project metadata missing"; exit 1; }
          python3 - "apps/$PROJECT/project.json" <<'PY'
          import json, os, sys
          meta=json.load(open(sys.argv[1], encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('project_id='+str(meta['id']).replace('\n',' ')+'\n')
              f.write('app_name='+str(meta.get('name') or meta['id']).replace('\n',' ')+'\n')
              f.write('version='+str(int(meta.get('version',1)))+'\n')
          PY
          echo "request_id=${{ steps.meta.outputs.request_id }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare and compile Android APK
        shell: bash
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/acc-build.log"
          {
            set -e
            PROJECT="${{ steps.app.outputs.project_id }}"
            APP_NAME="${{ steps.app.outputs.app_name }}"
            APP_ID="com.accbuilder.$(echo "$PROJECT" | tr -cd 'a-z0-9' | cut -c1-40)"
            BUILD_DIR="$RUNNER_TEMP/acc-mobile"
            mkdir -p "$BUILD_DIR/www"
            cp "apps/$PROJECT/index.html" "$BUILD_DIR/www/index.html"
            if [ -f "apps/$PROJECT/icon.svg" ]; then cp "apps/$PROJECT/icon.svg" "$BUILD_DIR/www/icon.svg"; fi
            if [ -f "apps/$PROJECT/v3.js" ]; then
              cp "apps/$PROJECT/v3.js" "$BUILD_DIR/www/v3.js"
              python3 - "$BUILD_DIR/www/index.html" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          marker='<script src="v3.js"></script>'
          if marker not in s:
              pos=s.lower().rfind('</body>')
              if pos < 0: raise SystemExit('index.html has no closing body')
              s=s[:pos]+marker+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
            fi
            cd "$BUILD_DIR"
            cat > package.json <<'JSON'
          {
            "name":"acc-generated-app",
            "version":"1.4.0",
            "private":true,
            "dependencies":{"@capacitor/core":"^7.0.0","@capacitor/android":"^7.0.0"},
            "devDependencies":{"@capacitor/cli":"^7.0.0"}
          }
          JSON
            python3 - <<PY
          import json
          open('capacitor.config.json','w',encoding='utf-8').write(json.dumps({
            'appId':'$APP_ID','appName':'''$APP_NAME''','webDir':'www','server':{'androidScheme':'https'}
          },ensure_ascii=False,indent=2))
          PY
            npm install --no-audit --no-fund
            npx cap add android
            npx cap sync android
            if [ "$PROJECT" = "acc-media-downloader" ]; then
              python3 "$GITHUB_WORKSPACE/scripts/configure_acc_media_android.py" "$BUILD_DIR"
              python3 "$GITHUB_WORKSPACE/scripts/patch_acc_media_youtube_403.py" "$BUILD_DIR"
              python3 "$GITHUB_WORKSPACE/scripts/patch_acc_media_metadata.py" "$BUILD_DIR"
            fi
            cd "$BUILD_DIR/android"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
            echo "$BUILD_DIR" > "$GITHUB_WORKSPACE/.acc-build-dir"
          } 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Persist failure log
        if: failure()
        shell: bash
        run: |
          REQ="${{ steps.meta.outputs.request_id }}"
          mkdir -p build-logs
          if [ -f acc-build.log ]; then cp acc-build.log "build-logs/$REQ.log"; else echo "Build failed before compiler log was created." > "build-logs/$REQ.log"; fi
          git config user.name "ACC AI Builder"
          git config user.email "actions@users.noreply.github.com"
          git add "build-logs/$REQ.log"
          if ! git diff --cached --quiet; then
            git commit -m "ACC Builder failure log: $REQ"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Prepare APK
        id: apk
        shell: bash
        run: |
          BUILD_DIR="$(cat .acc-build-dir)"
          PROJECT="${{ steps.app.outputs.project_id }}"
          VERSION="${{ steps.app.outputs.version }}"
          REQUEST="${{ steps.app.outputs.request_id }}"
          mkdir -p dist
          APK_NAME="${PROJECT}-v${VERSION}.apk"
          cp "$BUILD_DIR/android/app/build/outputs/apk/debug/app-debug.apk" "dist/$APK_NAME"
          echo "path=dist/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=build-$REQUEST" >> "$GITHUB_OUTPUT"

      - name: Mark project ready
        run: python3 scripts/mark_build.py "${{ steps.app.outputs.project_id }}" ready

      - name: Commit project status
        shell: bash
        run: |
          git config user.name "ACC AI Builder"
          git config user.email "actions@users.noreply.github.com"
          git add "apps/${{ steps.app.outputs.project_id }}"
          if ! git diff --cached --quiet; then
            git commit -m "ACC Builder: update ${{ steps.app.outputs.project_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Create APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.apk.outputs.tag }}"
          APK="${{ steps.apk.outputs.path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "ACC APK · ${{ steps.app.outputs.app_name }} v${{ steps.app.outputs.version }}" --notes "ACC Media Downloader v3.2: readable title-based filenames, embedded audio metadata and cover art, MP3 bitrate selection (128/192/256/320 kbps), video title filenames, runtime yt-dlp refresh, Spotify helper/batch downloads, and premium branding." --target "${{ github.sha }}"
          fi
