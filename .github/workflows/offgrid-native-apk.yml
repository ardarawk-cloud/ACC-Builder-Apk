name: OFFGRID Native APK

on:
  push:
    branches:
      - build/offgrid-phase0-native
    paths:
      - "native/offgrid/.release-trigger"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native OFFGRID APK
        working-directory: native/offgrid
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp native/offgrid/app/build/outputs/apk/debug/app-debug.apk dist/OFFGRID-Alpha-v1.apk
          sha256sum dist/OFFGRID-Alpha-v1.apk | tee dist/OFFGRID-Alpha-v1.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OFFGRID-Alpha-v1
          path: |
            dist/OFFGRID-Alpha-v1.apk
            dist/OFFGRID-Alpha-v1.sha256
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="offgrid-alpha-v1-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/OFFGRID-Alpha-v1.apk dist/OFFGRID-Alpha-v1.sha256 --clobber
          else
            gh release create "$TAG" dist/OFFGRID-Alpha-v1.apk dist/OFFGRID-Alpha-v1.sha256 \
              --title "OFFGRID Alpha v1" \
              --notes "Milestone build. Direct encrypted BLE chat, persistent local history, signed identity verification, cleaner Chats/Groups/Nearby/Settings UI, encrypted persistent store-and-forward group mesh, automatic relay handoff across nearby phones, dedupe/TTL/hop controls, reconnect handling, diagnostics, and offline installer sharing through Android local sharing transports. Dev-signed alpha; production signing remains separate." \
              --target "$GITHUB_SHA"
          fi
