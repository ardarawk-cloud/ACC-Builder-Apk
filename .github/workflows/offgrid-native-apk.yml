name: OFFGRID Native APK

on:
  push:
    branches:
      - build/offgrid-phase0-native
    paths:
      - "native/offgrid/**"
      - ".github/workflows/offgrid-native-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native OFFGRID APK
        working-directory: native/offgrid
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp native/offgrid/app/build/outputs/apk/debug/app-debug.apk dist/OFFGRID-v0.1.3-phase1-identity.apk
          sha256sum dist/OFFGRID-v0.1.3-phase1-identity.apk | tee dist/OFFGRID-v0.1.3-phase1-identity.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OFFGRID-v0.1.3-phase1-identity
          path: |
            dist/OFFGRID-v0.1.3-phase1-identity.apk
            dist/OFFGRID-v0.1.3-phase1-identity.sha256
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="offgrid-phase1-identity-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/OFFGRID-v0.1.3-phase1-identity.apk dist/OFFGRID-v0.1.3-phase1-identity.sha256 --clobber
          else
            gh release create "$TAG" dist/OFFGRID-v0.1.3-phase1-identity.apk dist/OFFGRID-v0.1.3-phase1-identity.sha256 \
              --title "OFFGRID Phase 1.3 Identity Verification APK" \
              --notes "Encrypted BLE direct chat with persistent Android Keystore identity, signed ephemeral ECDH handshake, pairwise Safety Code verification, verified-peer identity pinning, changed-identity blocking, SQLite local history, delivery ACK and bounded client reconnect retries. Dev-signed and update-compatible with prior Phase 1 dev builds." \
              --target "$GITHUB_SHA"
          fi
