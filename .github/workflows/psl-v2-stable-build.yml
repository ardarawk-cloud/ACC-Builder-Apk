name: PSL V2 Stable Build

on:
  push:
    branches: [main]
    paths:
      - "psl-v2-build-requests/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psl-v2-stable-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release identity lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='apps/papa-sauce-lab/release-lock.json'
          d=json.load(open(p))
          assert d['release_channel']=='V2_STABLE'
          assert d['canonical_package_id']=='com.nadmo.papasaucelab'
          assert d['canonical_certificate_sha256']=='2620121f6003647bd9c35713647c296cb4479aecef6efadfcf7fece471edbfe5'
          assert d['legacy_status']=='FROZEN_DO_NOT_BUILD'
          print('PSL release identity lock OK')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore PSL V2 signing key
        id: pslkey
        uses: actions/cache@v4
        with:
          path: ~/.psl-signing
          key: psl-stable-signing-v1

      - name: Verify signing key is present
        shell: bash
        run: |
          set -euo pipefail
          KEY="$HOME/.psl-signing/papa-sauce-lab.jks"
          test -f "$KEY" || { echo "FATAL: PSL signing key cache missing. Refusing to generate a new key."; exit 1; }
          keytool -list -keystore "$KEY" -storepass "PapaSauceLabStable2026" -alias "papasaucelab" >/dev/null

      - name: Build PSL V2 stable APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="papa-sauce-lab"
          APP_NAME="Papa Sauce Lab NEW"
          APP_ID="$(python3 -c "import json;print(json.load(open('apps/papa-sauce-lab/release-lock.json'))['canonical_package_id'])")"
          VERSION="$(python3 -c "import json;print(int(json.load(open('apps/papa-sauce-lab/project.json'))['version']))")"
          BUILD_DIR="$RUNNER_TEMP/psl-v2-mobile"
          mkdir -p "$BUILD_DIR/www"
          cp "apps/$PROJECT/index.html" "$BUILD_DIR/www/index.html"
          [ ! -f "apps/$PROJECT/icon.svg" ] || cp "apps/$PROJECT/icon.svg" "$BUILD_DIR/www/icon.svg"

          python3 - "$BUILD_DIR/www/index.html" "$VERSION" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); version=sys.argv[2]; text=p.read_text(encoding='utf-8')
          token='__PSL_APP_VERSION__'
          if token not in text:
              raise SystemExit('version display token missing')
          p.write_text(text.replace(token,version),encoding='utf-8')
          PY

          cd "$BUILD_DIR"
          cat > package.json <<'JSON'
          {
            "name":"papa-sauce-lab-v2",
            "version":"1.0.0",
            "private":true,
            "dependencies":{"@capacitor/core":"^7.0.0","@capacitor/android":"^7.0.0"},
            "devDependencies":{"@capacitor/cli":"^7.0.0"}
          }
          JSON

          python3 - <<PY
          import json
          open('capacitor.config.json','w',encoding='utf-8').write(json.dumps({
            'appId':'$APP_ID','appName':'$APP_NAME','webDir':'www','server':{'androidScheme':'https'}
          },ensure_ascii=False,indent=2))
          PY

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          RES="$BUILD_DIR/android/app/src/main/res"
          mkdir -p "$RES/mipmap-anydpi"
          find "$RES" -type f \( -name 'ic_launcher*.png' -o -name 'ic_launcher*.webp' \) -delete
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          cp "$GITHUB_WORKSPACE/apps/$PROJECT/icon-android.xml" "$RES/mipmap-anydpi/ic_launcher.xml"
          cp "$GITHUB_WORKSPACE/apps/$PROJECT/icon-android.xml" "$RES/mipmap-anydpi/ic_launcher_round.xml"

          export PSL_KEYSTORE_PATH="$HOME/.psl-signing/papa-sauce-lab.jks"
          python3 - "$BUILD_DIR/android/app/build.gradle" "$VERSION" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); version=int(sys.argv[2]); s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', f'versionCode {version}', s, count=1)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', f'versionName "{version}.0"', s, count=1)
          marker='android {'
          block='''android {\n    signingConfigs {\n        debug {\n            storeFile file(System.getenv("PSL_KEYSTORE_PATH"))\n            storePassword "PapaSauceLabStable2026"\n            keyAlias "papasaucelab"\n            keyPassword "PapaSauceLabStable2026"\n        }\n    }'''
          if marker not in s:
              raise SystemExit('android block not found')
          s=s.replace(marker,block,1)
          p.write_text(s)
          PY

          cd "$BUILD_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/papa-sauce-lab-v2-v${VERSION}.apk"
          echo "$VERSION" > "$GITHUB_WORKSPACE/.psl-v2-version"

      - name: Verify V2 package source and signature
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat .psl-v2-version)"
          APK="dist/papa-sauce-lab-v2-v${VERSION}.apk"
          TOOL="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          CERT="$($TOOL verify --print-certs "$APK" 2>&1)"
          echo "$CERT"
          EXPECTED_CERT="$(python3 -c "import json;print(json.load(open('apps/papa-sauce-lab/release-lock.json'))['canonical_certificate_sha256'])")"
          ACTUAL_CERT="$(echo "$CERT" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || { echo "FATAL: signer mismatch"; exit 1; }
          unzip -p "$APK" assets/public/index.html | grep -q 'PSL_V19_SAFE_MIGRATION'
          unzip -p "$APK" assets/public/index.html | grep -q 'PSL_V18_LAB_COST_CENTER_REPORT'
          unzip -p "$APK" assets/public/index.html | grep -q 'Import JSON Backup'
          unzip -p "$APK" assets/public/index.html | grep -q "putMany19('snapshots'"
          unzip -p "$APK" assets/public/index.html | grep -q "PSL v${VERSION} · Stable Update"
          ! unzip -p "$APK" assets/public/index.html | grep -q "__PSL_APP_VERSION__"

      - name: Upload V2 stable APK
        uses: actions/upload-artifact@v4
        with:
          name: papa-sauce-lab-v2-stable.apk
          path: dist/papa-sauce-lab-v2-v*.apk
          retention-days: 30

      - name: Publish V2 stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(cat .psl-v2-version)"
          APK="dist/papa-sauce-lab-v2-v${VERSION}.apk"
          TAG="psl-v2-stable-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Papa Sauce Lab V2 Stable v${VERSION}" --notes "Side-by-side migration-safe baseline. Package: com.nadmo.papasaucelab. Signing certificate is pinned and verified." --target "$GITHUB_SHA"
          fi
