name: Fetch APK Signer Tool

on:
  push:
    branches:
      - feat/bali-wedding-dj-cloud-v2
    paths:
      - ".github/workflows/fetch-apk-signer-tool.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-tool:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download verified uber-apk-signer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o uber-apk-signer-1.3.0.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar" | sha256sum -c -
          java -jar uber-apk-signer-1.3.0.jar --help >/dev/null

      - name: Upload signer tool
        uses: actions/upload-artifact@v4
        with:
          name: BWD-APK-SIGNER-TOOL
          path: uber-apk-signer-1.3.0.jar
          retention-days: 1
