name: NADMO LIVE v0.10.25 OFFGRID embedded signed candidate
# retry-4: verify embedded classes from DEX descriptors
on:
  push:
    branches: ['feat/nadmo-live-offgrid-native-embedded-v2-20261026']
    paths: ['.github/workflows/nadmo-live-0125-offgrid-embedded.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nadmo-live-v01025-offgrid-embedded
  cancel-in-progress: false
jobs:
  signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with: {packages: ''}
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}

      - name: OFFGRID embedded and NADMO LIVE regression contracts
        run: |
          node nadmo-live/android/qa/offgrid-local-contract.mjs
          node nadmo-live/android/qa/radio-open-music-contract.mjs
          node nadmo-live/android/qa/game-background-contract.mjs
          node nadmo-live/android/qa/game-floating-privacy-contract.mjs
          node nadmo-live/android/qa/webview-document-contract.mjs

      - name: Require original NADMO LIVE owner signing material
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NADMO_LIVE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.NADMO_LIVE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NADMO_LIVE_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NADMO_LIVE_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nadmo-release.jks"
          test -s "$RUNNER_TEMP/nadmo-release.jks"
          echo "NADMO_LIVE_RELEASE_STORE_FILE=$RUNNER_TEMP/nadmo-release.jks" >> "$GITHUB_ENV"
          echo "NADMO_LIVE_RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "NADMO_LIVE_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NADMO_LIVE_RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Assemble signed NADMO LIVE with embedded OFFGRID
        run: gradle -p nadmo-live/android :app:assembleRelease --no-daemon --stacktrace

      - name: Verify package version signing and embedded OFFGRID classes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=nadmo-live/android/app/build/outputs/apk/release/app-release.apk
          test -s "$SOURCE"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGN="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          META=$("$AAPT" dump badging "$SOURCE" | head -1)
          printf '%s\n' "$META"
          printf '%s\n' "$META" | grep -F "name='id.nadmo.live'"
          printf '%s\n' "$META" | grep -F "versionCode='44'"
          printf '%s\n' "$META" | grep -F "versionName='0.10.25'"
          VERIFY=$("$SIGN" verify --verbose --print-certs "$SOURCE")
          printf '%s\n' "$VERIFY"
          printf '%s\n' "$VERIFY" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
          EXPECTED=$(jq -r '.certificate_sha256' nadmo-live/android/release-identity.json)
          ACTUAL=$(printf '%s\n' "$VERIFY" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"
          DEX_TEXT="$RUNNER_TEMP/offgrid-dex-strings.txt"
          : > "$DEX_TEXT"
          for DEX in $(unzip -Z1 "$SOURCE" | grep -E '^classes([0-9]+)?\.dex
          if unzip -l "$SOURCE" | grep -Fq 'nadmo-release.jks';then echo 'Keystore leakage';exit 1;fi
          mkdir -p qa-signed
          cp "$SOURCE" qa-signed/NADMO-LIVE-v0.10.25-offgrid-embedded.apk
          (cd qa-signed && sha256sum NADMO-LIVE-v0.10.25-offgrid-embedded.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: nadmo-live-v01025-offgrid-embedded
          path: qa-signed/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish direct owner-test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=nadmo-live-v0.10.25-offgrid-embedded-beta
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1;then
            echo "::error::Release tag $TAG already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$TAG" qa-signed/NADMO-LIVE-v0.10.25-offgrid-embedded.apk qa-signed/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NADMO LIVE v0.10.25 — OFFGRID embedded owner test" \
            --notes "Owner-test candidate. OFFGRID encrypted BLE direct chat, groups, nearby discovery, persistent history, identity verification, encrypted store-and-forward mesh, auto relay, diagnostics and offline APK sharing are embedded inside package id.nadmo.live; no separate OFFGRID APK is required. Existing NADMO LIVE package and owner signing certificate are preserved for install-over updates. Physical three-phone A→B→C mesh remains PENDING and is not claimed PASS until tested on real devices." \
            --prerelease --latest=false

      - name: Wipe signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nadmo-release.jks"
); do
            unzip -p "$SOURCE" "$DEX" | strings >> "$DEX_TEXT"
          done
          grep -Fq 'Lcom/offgrid/mesh/OffgridActivity;' "$DEX_TEXT"
          grep -Fq 'Lcom/offgrid/mesh/BleChatManager;' "$DEX_TEXT"
          grep -Fq 'Lcom/offgrid/mesh/MeshStore;' "$DEX_TEXT"
          if unzip -l "$SOURCE" | grep -Fq 'nadmo-release.jks';then echo 'Keystore leakage';exit 1;fi
          mkdir -p qa-signed
          cp "$SOURCE" qa-signed/NADMO-LIVE-v0.10.25-offgrid-embedded.apk
          (cd qa-signed && sha256sum NADMO-LIVE-v0.10.25-offgrid-embedded.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: nadmo-live-v01025-offgrid-embedded
          path: qa-signed/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish direct owner-test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=nadmo-live-v0.10.25-offgrid-embedded-beta
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1;then
            echo "::error::Release tag $TAG already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$TAG" qa-signed/NADMO-LIVE-v0.10.25-offgrid-embedded.apk qa-signed/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NADMO LIVE v0.10.25 — OFFGRID embedded owner test" \
            --notes "Owner-test candidate. OFFGRID encrypted BLE direct chat, groups, nearby discovery, persistent history, identity verification, encrypted store-and-forward mesh, auto relay, diagnostics and offline APK sharing are embedded inside package id.nadmo.live; no separate OFFGRID APK is required. Existing NADMO LIVE package and owner signing certificate are preserved for install-over updates. Physical three-phone A→B→C mesh remains PENDING and is not claimed PASS until tested on real devices." \
            --prerelease --latest=false

      - name: Wipe signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nadmo-release.jks"
